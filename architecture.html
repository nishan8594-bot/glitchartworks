<title>Glitch Artworks — Architecture</title>

<!-- Shared chrome (header, footer, toggle, effects, image-protection) -->
<link rel="stylesheet" href="glitch-core.css">
<!-- Apply saved theme before paint to avoid a flash -->
<script>try{if(localStorage.getItem('glitch-theme')==='day')document.documentElement.classList.add('day');}catch(e){}</script>
<script>window.GLITCH={active:'architecture'};</script>

<!-- Page accent: vivid orange (single value works in both themes) -->
<style>
:root{ --accent:#ff7f00; }

/* ambient dot-grid + scanline, theme-aware */
.bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(circle,color-mix(in srgb,var(--text) 6%,transparent) 1px,transparent 1px);
  background-size:52px 52px;}
.scanline{position:fixed;top:-2px;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--accent-eff) 30%,transparent),transparent);
  animation:scan 18s linear infinite;z-index:40;pointer-events:none;}
.wash{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at center, rgba(255,127,0,0.0) 0%, transparent 65%);
  transition:background 0.6s ease;}

/* MAIN SCENE — now lives in normal flow, framed by the shared header/footer */
.scene{position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:90px 24px 60px;}
.composition{position:relative;transition:transform 0.1s ease;}
.lines-svg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:1;overflow:visible;}
.letters-svg{position:relative;z-index:2;overflow:visible;cursor:default;}

/* construction lines / circles / extended lines — driven by the accent */
.cl{fill:none;stroke:color-mix(in srgb,var(--accent-eff) 18%,transparent);stroke-width:0.3px;stroke-miterlimit:10;transition:stroke 0.5s ease, opacity 0.5s ease;}
.cc{fill:none;stroke:color-mix(in srgb,var(--accent-eff) 14%,transparent);stroke-width:0.3px;transition:stroke 0.5s ease, opacity 0.5s ease;}
.cl-ext{fill:none;stroke:transparent;stroke-width:0.4px;stroke-dasharray:4 8;transition:stroke 0.6s ease, stroke-dashoffset 0.8s cubic-bezier(0.4,0,0.2,1);}
.lp{fill:color-mix(in srgb,var(--text) 92%,transparent);transition:fill 0.4s ease;}
.composition.hovered .cl{stroke:color-mix(in srgb,var(--accent-eff) 55%,transparent);}
.composition.hovered .cc{stroke:color-mix(in srgb,var(--accent-eff) 40%,transparent);}
.composition.hovered .cl-ext{stroke:color-mix(in srgb,var(--accent-eff) 35%,transparent);stroke-dashoffset:0;}
.composition.hovered .lp{fill:var(--text);}
.pulse-dot{fill:color-mix(in srgb,var(--accent-eff) 50%,transparent);animation:dotPulse 2s ease-in-out infinite;}
@keyframes dotPulse{0%,100%{opacity:0.3;r:2}50%{opacity:0.9;r:3.5}}
.glow-line{stroke:transparent;fill:none;stroke-width:1px;filter:url(#purpleGlow);transition:stroke 0.5s ease;}
.composition.hovered .glow-line{stroke:color-mix(in srgb,var(--accent-eff) 30%,transparent);}

/* small caption under the wordmark */
.coming-tag{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);z-index:20;
  font-family:"Cormorant Garamond",serif;font-style:italic;font-size:15px;font-weight:300;
  letter-spacing:0.06em;color:var(--text-dim);text-align:center;transition:color 0.6s;}
</style>

<script>
const comp     = document.getElementById('comp');
const wash     = document.getElementById('wash');
const lettersSvg = document.getElementById('lettersSvg');

// ── SIZE SVG to fit viewport ──
function sizeComposition() {
  const W = window.innerWidth;
  const H = window.innerHeight;
  const padding = 80;
  // viewBox is 675.9 x 316.94
  const aspect = 675.9 / 316.94;
  let w = W - padding*2;
  let h = w / aspect;
  if(h > H - padding*2) {
    h = H - padding*2;
    w = h * aspect;
  }
  lettersSvg.style.width  = w + 'px';
  lettersSvg.style.height = h + 'px';
}
sizeComposition();
window.addEventListener('resize', sizeComposition);

// ── HOVER INTERACTION ──
let isHovered = false;
let mouseX = 0, mouseY = 0;
let targetTiltX = 0, targetTiltY = 0;
let currentTiltX = 0, currentTiltY = 0;

comp.addEventListener('mouseenter', () => {
  isHovered = true;
  comp.classList.add('hovered');
  wash.style.background = 'radial-gradient(ellipse at center, rgba(255,127,0,0.18) 0%, transparent 65%)';
  // init extended line dash offsets
  document.querySelectorAll('.cl-ext').forEach(l => {
    const len = getLineLength(l);
    l.setAttribute('stroke-dasharray', len);
    l.setAttribute('stroke-dashoffset', len);
    // trigger reveal after class applied
    setTimeout(() => l.setAttribute('stroke-dashoffset', '0'), 10);
  });
});

comp.addEventListener('mouseleave', () => {
  isHovered = false;
  comp.classList.remove('hovered');
  wash.style.background = 'radial-gradient(ellipse at center, rgba(255,127,0,0.0) 0%, transparent 65%)';
  targetTiltX = 0; targetTiltY = 0;
});

comp.addEventListener('mousemove', e => {
  const rect = comp.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top  + rect.height/2;
  targetTiltY =  ((e.clientX - cx) / (rect.width/2))  * 6;
  targetTiltX = -((e.clientY - cy) / (rect.height/2)) * 3;
});

function getLineLength(el) {
  if(el.tagName === 'line') {
    const dx = el.x2.baseVal.value - el.x1.baseVal.value;
    const dy = el.y2.baseVal.value - el.y1.baseVal.value;
    return Math.sqrt(dx*dx + dy*dy);
  }
  return 100;
}

// Set initial dash state for extended lines
document.querySelectorAll('.cl-ext').forEach(l => {
  const len = getLineLength(l) || 100;
  l.setAttribute('stroke-dasharray', len);
  l.setAttribute('stroke-dashoffset', len);
});

// ── ANIMATE — smooth tilt only on hover ──
function animate() {
  requestAnimationFrame(animate);
  currentTiltX += (targetTiltX - currentTiltX) * 0.08;
  currentTiltY += (targetTiltY - currentTiltY) * 0.08;
  if(isHovered) {
    comp.style.transform = `perspective(800px) rotateX(${currentTiltX}deg) rotateY(${currentTiltY}deg)`;
  } else {
    comp.style.transform = `perspective(800px) rotateX(${currentTiltX}deg) rotateY(${currentTiltY}deg)`;
  }
}
animate();
</script>
