<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glitch Artworks — Architecture</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#080706;color:#f0ebe0;font-family:'Syne',sans-serif;overflow:hidden;}

/* grain */
body::after{content:'';position:fixed;inset:0;z-index:50;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");opacity:0.4;}

/* ambient orbs */
.orb{position:fixed;border-radius:50%;filter:blur(130px);pointer-events:none;z-index:0;}
.orb1{width:600px;height:600px;background:#d4832a;opacity:0.07;top:-200px;right:-150px;}
.orb2{width:500px;height:500px;background:#8a4a15;opacity:0.06;bottom:-150px;left:-150px;}

/* dot grid */
.bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(circle,rgba(240,235,224,0.05) 1px,transparent 1px);
  background-size:52px 52px;}

/* scanline */
.scanline{position:fixed;top:-2px;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(212,131,42,0.08),transparent);
  animation:scan 18s linear infinite;z-index:40;pointer-events:none;}
@keyframes scan{0%{top:-2px}100%{top:100vh}}

/* wash */
.wash{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at center, rgba(212,131,42,0.0) 0%, transparent 65%);
  transition:background 0.6s ease;}

/* UI */
.ui{position:fixed;inset:0;z-index:20;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:28px 40px;}
.ui-top{display:flex;justify-content:space-between;align-items:flex-start;}
.brand{font-size:9px;letter-spacing:0.4em;text-transform:uppercase;color:rgba(240,235,224,0.2);}
.category{font-size:9px;letter-spacing:0.3em;text-transform:uppercase;color:rgba(212,131,42,0.5);}
.ui-bottom{display:flex;justify-content:space-between;align-items:flex-end;}
.tagline{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;font-weight:300;letter-spacing:0.06em;color:rgba(240,235,224,0.25);line-height:1.7;}
.nav-links{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
.back{pointer-events:auto;font-size:9px;letter-spacing:0.28em;text-transform:uppercase;color:rgba(240,235,224,0.18);text-decoration:none;transition:color 0.3s;}
.back:hover{color:rgba(212,131,42,0.9);}
.hint{font-size:8px;letter-spacing:0.2em;color:rgba(240,235,224,0.08);animation:breathe 3s ease-in-out infinite;}
@keyframes breathe{0%,100%{opacity:0.08}50%{opacity:0.28}}

/* MAIN SCENE */
.scene{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;}

/* SVG wrapper — the whole composition */
.composition{
  position:relative;
  transition:transform 0.1s ease;
}

/* construction lines SVG */
.lines-svg{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  z-index:1;
  overflow:visible;
}

/* letter outlines SVG */
.letters-svg{
  position:relative;
  z-index:2;
  overflow:visible;
  cursor:default;
}

/* construction line style */
.cl{
  fill:none;
  stroke:rgba(212,131,42,0.18);
  stroke-width:0.3px;
  stroke-miterlimit:10;
  transition:stroke 0.5s ease, opacity 0.5s ease;
}

/* circles */
.cc{
  fill:none;
  stroke:rgba(212,131,42,0.14);
  stroke-width:0.3px;
  transition:stroke 0.5s ease, opacity 0.5s ease;
}

/* extended lines — spread outward on hover, hidden by default */
.cl-ext{
  fill:none;
  stroke:rgba(212,131,42,0.0);
  stroke-width:0.4px;
  stroke-dasharray:4 8;
  transition:stroke 0.6s ease, stroke-dashoffset 0.8s cubic-bezier(0.4,0,0.2,1);
}

/* letter paths — white */
.lp{
  fill:rgba(240,235,224,0.92);
  transition:fill 0.4s ease;
}

/* hover state classes */
.composition.hovered .cl{
  stroke:rgba(212,131,42,0.55);
}
.composition.hovered .cc{
  stroke:rgba(212,131,42,0.4);
}
.composition.hovered .cl-ext{
  stroke:rgba(212,131,42,0.35);
  stroke-dashoffset:0;
}
.composition.hovered .lp{
  fill:rgba(255,255,255,1);
}

/* pulse dots at line endpoints */
.pulse-dot{
  fill:rgba(212,131,42,0.5);
  animation:dotPulse 2s ease-in-out infinite;
}
@keyframes dotPulse{0%,100%{opacity:0.3;r:2}50%{opacity:0.9;r:3.5}}

/* glow filter */
.glow-line{
  stroke:rgba(212,131,42,0.0);
  fill:none;
  stroke-width:1px;
  filter:url(#purpleGlow);
  transition:stroke 0.5s ease;
}
.composition.hovered .glow-line{
  stroke:rgba(212,131,42,0.3);
}
/* ── LIGHTNING PROTECTION ── */
#lightning{position:fixed;inset:0;z-index:99999;pointer-events:none;display:flex;align-items:center;justify-content:center;opacity:0;}
#lightning.strike{animation:strikeSeq 1.3s forwards;}
@keyframes strikeSeq{
  0%{opacity:0;background:transparent;}
  6%{opacity:1;background:rgba(255,20,20,0.12);}
  12%{opacity:0;background:transparent;}
  18%{opacity:1;background:rgba(255,20,20,0.22);}
  24%{opacity:0;background:transparent;}
  30%{opacity:1;background:rgba(255,30,30,0.35);}
  42%{opacity:0;background:transparent;}
  100%{opacity:0;}
}
#lightning svg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);opacity:0;filter:drop-shadow(0 0 24px #ff2200) drop-shadow(0 0 60px #ff4400);}
#lightning.strike svg{animation:boltFlash 1.3s forwards;}
@keyframes boltFlash{
  0%{opacity:0;transform:translate(-50%,-50%) scale(0.7);}
  8%{opacity:1;transform:translate(-50%,-50%) scale(1.05);}
  16%{opacity:0;}
  22%{opacity:0.95;transform:translate(-50%,-50%) scale(1);}
  32%{opacity:0;}
  40%{opacity:1;transform:translate(-50%,-50%) scale(1.02);}
  58%{opacity:0;transform:translate(-50%,-50%) scale(1);}
  100%{opacity:0;}
}
#lightning-msg{position:absolute;bottom:18%;left:50%;transform:translateX(-50%);font-family:"Syne",sans-serif;font-size:10px;letter-spacing:0.35em;text-transform:uppercase;color:#ff4422;opacity:0;text-shadow:0 0 14px rgba(255,60,20,0.9);white-space:nowrap;}
#lightning.strike #lightning-msg{animation:msgFlash 1.3s forwards;}
@keyframes msgFlash{0%{opacity:0;}42%{opacity:0;}52%{opacity:1;}88%{opacity:1;}100%{opacity:0;}}</style>
</head>

<script>
const comp     = document.getElementById('comp');
const wash     = document.getElementById('wash');
const lettersSvg = document.getElementById('lettersSvg');

// ── SIZE SVG to fit viewport ──
function sizeComposition() {
  const W = window.innerWidth;
  const H = window.innerHeight;
  const padding = 80;
  // viewBox is 675.9 x 316.94
  const aspect = 675.9 / 316.94;
  let w = W - padding*2;
  let h = w / aspect;
  if(h > H - padding*2) {
    h = H - padding*2;
    w = h * aspect;
  }
  lettersSvg.style.width  = w + 'px';
  lettersSvg.style.height = h + 'px';
}
sizeComposition();
window.addEventListener('resize', sizeComposition);

// ── HOVER INTERACTION ──
let isHovered = false;
let mouseX = 0, mouseY = 0;
let targetTiltX = 0, targetTiltY = 0;
let currentTiltX = 0, currentTiltY = 0;

comp.addEventListener('mouseenter', () => {
  isHovered = true;
  comp.classList.add('hovered');
  wash.style.background = 'radial-gradient(ellipse at center, rgba(212,131,42,0.18) 0%, transparent 65%)';
  // init extended line dash offsets
  document.querySelectorAll('.cl-ext').forEach(l => {
    const len = getLineLength(l);
    l.setAttribute('stroke-dasharray', len);
    l.setAttribute('stroke-dashoffset', len);
    // trigger reveal after class applied
    setTimeout(() => l.setAttribute('stroke-dashoffset', '0'), 10);
  });
});

comp.addEventListener('mouseleave', () => {
  isHovered = false;
  comp.classList.remove('hovered');
  wash.style.background = 'radial-gradient(ellipse at center, rgba(212,131,42,0.0) 0%, transparent 65%)';
  targetTiltX = 0; targetTiltY = 0;
});

comp.addEventListener('mousemove', e => {
  const rect = comp.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top  + rect.height/2;
  targetTiltY =  ((e.clientX - cx) / (rect.width/2))  * 6;
  targetTiltX = -((e.clientY - cy) / (rect.height/2)) * 3;
});

function getLineLength(el) {
  if(el.tagName === 'line') {
    const dx = el.x2.baseVal.value - el.x1.baseVal.value;
    const dy = el.y2.baseVal.value - el.y1.baseVal.value;
    return Math.sqrt(dx*dx + dy*dy);
  }
  return 100;
}

// Set initial dash state for extended lines
document.querySelectorAll('.cl-ext').forEach(l => {
  const len = getLineLength(l) || 100;
  l.setAttribute('stroke-dasharray', len);
  l.setAttribute('stroke-dashoffset', len);
});

// ── ANIMATE — smooth tilt only on hover ──
function animate() {
  requestAnimationFrame(animate);
  currentTiltX += (targetTiltX - currentTiltX) * 0.08;
  currentTiltY += (targetTiltY - currentTiltY) * 0.08;
  if(isHovered) {
    comp.style.transform = `perspective(800px) rotateX(${currentTiltX}deg) rotateY(${currentTiltY}deg)`;
  } else {
    comp.style.transform = `perspective(800px) rotateX(${currentTiltX}deg) rotateY(${currentTiltY}deg)`;
  }
}
animate();
</script>
