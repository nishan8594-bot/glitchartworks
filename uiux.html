<style>
  :root {
    --bg: #080706;
    --bone: rgba(255,255,255,0.82);
    --dim: rgba(255,255,255,0.38);
    --accent: #fff34f;
    --accent2: rgba(255,243,79,0.18);
    --border: rgba(255,255,255,0.06);
    --blue: #4a9eff;
    --sidebar: 320px;
    --panel-h: 680px;
  }
  :root.day {
    --bg: #f8f6f1;
    --bone: rgba(0,0,0,0.8);
    --dim: rgba(0,0,0,0.4);
    --accent: #c9962a;
    --accent2: rgba(201,150,42,0.1);
    --border: rgba(0,0,0,0.08);
    --blue: #1a73e8;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: var(--bg); color: var(--bone); font-family: "Syne", sans-serif; overflow: hidden; cursor: none; }
  #cursor { position: fixed; pointer-events: none; z-index: 9999; top: 0; left: 0; }
  #cursor .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); position: absolute; transform: translate(-50%,-50%); box-shadow: 0 0 8px var(--accent); transition: transform 0.15s; }
  #cursor .ring { width: 28px; height: 28px; border-radius: 50%; border: 0.5px solid rgba(255,243,79,0.4); position: absolute; transform: translate(-50%,-50%); transition: width 0.3s, height 0.3s; }
  #cursor.hover .dot { transform: translate(-50%,-50%) scale(2.5); }
  #cursor.hover .ring { width: 48px; height: 48px; border-color: rgba(255,243,79,0.7); }
  #cursor-glow { position: fixed; pointer-events: none; z-index: 8999; width: 720px; height: 720px; border-radius: 50%; background: radial-gradient(circle, rgba(255,243,79,0.08) 0%, rgba(255,243,79,0.03) 40%, transparent 70%); transform: translate(-50%,-50%); opacity: 0; transition: opacity 0.4s; top: 0; left: 0; }
  .bg-grid { position: fixed; inset: 0; z-index: 0; pointer-events: none; background-image: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 52px 52px; }
  :root.day .bg-grid { background-image: radial-gradient(circle, rgba(0,0,0,0.04) 1px, transparent 1px); }

  /* Layout */
  #app { display: flex; width: 100vw; height: 100%; position: relative; z-index: 1; padding-top: 50px; padding-bottom: 30px; }

  /* Sidebar */
  #sidebar { width: var(--sidebar); height: 100%; flex-shrink: 0; border-right: 0.5px solid var(--border); display: flex; flex-direction: column; padding: 40px 28px 28px; overflow: hidden; position: relative; z-index: 2; background: var(--bg); }
  .sidebar-label { font-size: 8.5px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--dim); margin-bottom: 6px; }
  .sidebar-title { font-size: 28px; font-weight: 700; line-height: 1.1; margin-bottom: 4px; color: var(--bone); }
  .sidebar-title em { font-style: italic; font-family: "Cormorant Garamond", serif; font-weight: 300; }
  .sidebar-meta { font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--dim); margin-bottom: 28px; }
  .sidebar-desc { font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 300; font-size: 13px; line-height: 1.85; color: rgba(255,255,255,0.48); margin-bottom: 24px; }
  :root.day .sidebar-desc { color: rgba(0,0,0,0.45); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 32px; }
  .tag { font-size: 7.5px; letter-spacing: 0.15em; text-transform: uppercase; padding: 4px 9px; border: 0.5px solid var(--border); color: var(--dim); border-radius: 2px; }
  .sidebar-screens { flex: 1; overflow: hidden; }
  .sidebar-screens-label { font-size: 7.5px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--dim); margin-bottom: 10px; }
  .screen-list { display: flex; flex-direction: column; gap: 2px; }
  .screen-dot { width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--accent); flex-shrink: 0; margin-top: 2px; transition: background 0.2s; }
  .screen-dot.active { background: var(--accent); }
  .screen-item { display: flex; align-items: flex-start; gap: 10px; padding: 6px 0; border-bottom: 0.5px solid var(--border); cursor: none; }
  .screen-item:hover .screen-dot { background: var(--accent); }
  .screen-num { font-size: 8px; letter-spacing: 0.1em; color: var(--dim); min-width: 22px; }
  .screen-name { font-size: 10.5px; letter-spacing: 0.05em; color: var(--bone); }
  .sidebar-footer { padding-top: 20px; border-top: 0.5px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .footer-copy { font-size: 7.5px; letter-spacing: 0.1em; color: var(--dim); }

  /* Theme toggle */
  .theme-toggle { position: relative; width: 52px; height: 28px; cursor: none; }
  .theme-float { position: absolute; inset: 3px; background: rgba(255,255,255,0.06); border-radius: 99px; border: 0.5px solid var(--border); }
  :root.day .theme-float { background: rgba(0,0,0,0.06); }
  .theme-float-knob { position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #6a6a7a, #22222e); box-shadow: 0 2px 5px rgba(0,0,0,0.4); transition: transform 0.3s; }
  :root.day .theme-float-knob { transform: translateX(24px); background: radial-gradient(circle at 35% 30%, #fff5c0, #ffd040); box-shadow: 0 2px 6px rgba(0,0,0,0.14), 0 0 14px rgba(255,200,30,0.85); }

  /* Canvas */
  #canvas { flex: 1; overflow: hidden; height: 100%; display: flex; flex-direction: column; }
  .project-scroll { display: flex; height: 100%; overflow-x: auto; overflow-y: hidden; scroll-behavior: smooth; scrollbar-width: none; }
  .project-scroll::-webkit-scrollbar { display: none; }

  /* Intro panel */
  .project-intro { position: relative; width: var(--sidebar); flex-shrink: 0; height: 100%; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 40px 32px; border-right: 0.5px solid var(--border); }
  .bg-cover { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0.85; z-index: 0; }
  :root.day .bg-cover::after { content: ""; position: absolute; inset: 0; background: rgba(255,255,255,0.12); }
  .bg-cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.1) 100%); }
  .project-intro > *:not(.bg-cover) { position: relative; z-index: 1; }
  .pi-num { font-size: 8.5px; letter-spacing: 0.3em; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 8px; }
  .pi-name { font-size: 22px; font-weight: 700; line-height: 1.1; color: #fff; margin-bottom: 4px; }
  .pi-name em { font-style: italic; font-family: "Cormorant Garamond", serif; font-weight: 300; }
  .pi-type { font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(255,255,255,0.5); }

  /* Screen column panel */
  .cp { position: relative; height: 100%; border-right: 0.5px solid var(--border); flex-shrink: 0; overflow: hidden; display: flex; flex-direction: column; }
  .cp-screen { width: 300px; }

  /* Screen pair: proto on top, wireframe below */
  .screen-pair { display: flex; flex-direction: column; height: 100%; }
  .screen-half { flex: 1; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; background: var(--bg); }
  .screen-half.proto-half { border-bottom: 0.5px solid var(--border); }
  .screen-half img { max-width: 90%; max-height: 95%; object-fit: contain; display: block; cursor: none; transition: transform 0.3s; }
  .screen-half:hover img { transform: scale(1.02); }
  .screen-label { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; font-size: 7px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--dim); z-index: 2; }

  /* Screen name header */
  .screen-name-bar { position: absolute; top: 0; left: 0; right: 0; z-index: 3; padding: 10px 12px; display: flex; justify-content: center; }
  .screen-name-chip { font-size: 8px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--bone); background: var(--bg); border: 0.5px solid var(--border); padding: 4px 10px; border-radius: 2px; }

  /* Text panel */
  .cp-text { width: 360px; padding: 48px 40px; display: flex; flex-direction: column; justify-content: center; gap: 24px; background: var(--bg); }
  :root.day .cp-text { background: #ffffff; border-right: 0.5px solid rgba(0,0,0,0.08); }
  .cpt-label { font-size: 8.8px; letter-spacing: 0.25em; text-transform: uppercase; color: rgba(255,243,79,0.6); margin-bottom: 6px; display: block; }
  .cpt-body { font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 14.85px; font-weight: 300; line-height: 1.85; color: rgba(255,255,255,0.55); }
  :root.day .cpt-body { color: rgba(0,0,0,0.7); }
  :root.day .cpt-label { color: rgba(201,150,42,0.65); }

  /* Wireframe divider label */
  .wire-divider { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); z-index: 4; display: flex; align-items: center; gap: 8px; padding: 0 12px; pointer-events: none; }
  .wire-divider-line { flex: 1; height: 0.5px; background: var(--border); }
  .wire-divider-label { font-size: 7px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }

  /* Lightbox */
  #lb { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 9000; align-items: center; justify-content: center; }
  #lb.open { display: flex; }
  #lb-img { max-width: 88vw; max-height: 88vh; object-fit: contain; }
  #lb-close { position: absolute; top: 24px; right: 32px; font-size: 9.9px; letter-spacing: 0.3em; text-transform: uppercase; color: rgba(255,255,255,0.3); cursor: none; }
  #lb-close:hover { color: #fff; }
  #lb-prev, #lb-next { position: absolute; top: 50%; transform: translateY(-50%); font-size: 9.9px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.2); cursor: none; padding: 16px; }
  #lb-prev { left: 20px; } #lb-next { right: 20px; }
  #lb-prev:hover, #lb-next:hover { color: #fff; }

  /* Scroll dots */
  #scroll-dots { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 100; }
  .sdot { width: 4px; height: 4px; border-radius: 50%; background: rgba(255,255,255,0.2); transition: background 0.3s, transform 0.3s; }
  .sdot.active { background: var(--accent); transform: scale(1.4); }

  /* Copyright */
  /* ── Standardised site header ─────────────────────────── */
  header.site-hdr { position: fixed; top: 0; left: 0; right: 0; z-index: 200; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: rgba(8,7,6,0.55); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 0.5px solid var(--border); }
  :root.day header.site-hdr { background: rgba(248,246,241,0.6); }
  .hdr-left { display: flex; align-items: center; gap: 26px; }
  .hdr-logo { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; text-decoration: none; background: rgba(30,28,36,0.72); border: 0.5px solid rgba(255,255,255,0.10); box-shadow: 0 2px 8px rgba(0,0,0,0.45), 0 1px 0 rgba(255,255,255,0.06) inset; transition: transform 0.18s; cursor: none; }
  :root.day .hdr-logo { background: rgba(255,255,255,0.6); border: 0.5px solid rgba(0,0,0,0.08); }
  .hdr-logo:hover { transform: scale(1.1) translateY(-1px); }
  .hdr-logo svg { width: 14px; height: 14px; fill: var(--bone); }
  .hdr-logo.active svg { fill: var(--accent); filter: drop-shadow(0 0 4px var(--accent)); }
  .site-nav { display: flex; align-items: center; gap: 20px; }
  .nav-link { font-size: 10.5px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--dim); text-decoration: none; padding: 2px 0; border-bottom: 0.5px solid transparent; transition: color 0.2s, border-color 0.2s; cursor: none; }
  .nav-link:hover, .nav-link.active { color: var(--accent); border-bottom-color: var(--accent); }
  .hdr-right { display: flex; align-items: center; gap: 12px; }
  .hdr-toggle { margin-right: 4px; flex-shrink: 0; }
  .soc-icon { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #fff; background: rgba(30,28,36,0.72); border: 0.5px solid rgba(255,255,255,0.10); box-shadow: 0 2px 8px rgba(0,0,0,0.45); transition: transform 0.18s; cursor: none; }
  :root.day .soc-icon { background: rgba(255,255,255,0.6); border: 0.5px solid rgba(0,0,0,0.08); color: #1a1a1a; }
  .soc-icon:hover { transform: scale(1.12) translateY(-1px); }
  .soc-icon svg { width: 13px; height: 13px; }
  /* ── Standardised site footer ─────────────────────────── */
  footer.site-ftr { position: fixed; bottom: 0; left: 0; right: 0; z-index: 200; height: 30px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: rgba(8,7,6,0.55); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 0.5px solid var(--border); font-size: 7.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
  :root.day footer.site-ftr { background: rgba(248,246,241,0.6); }
  @media (max-width: 760px) { footer.site-ftr .foot-l, footer.site-ftr .foot-r { display: none; } .site-nav { gap: 11px; } .nav-link { font-size: 9px; letter-spacing: 0.14em; } }
  .cr-bar { position: fixed; bottom: 0; right: 0; left: var(--sidebar); height: 28px; display: flex; align-items: center; justify-content: flex-end; padding: 0 28px; border-top: 0.5px solid var(--border); z-index: 50; background: var(--bg); font-size: 7.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }

  /* day-mode polish */
  :root.day .sdot { background: rgba(0,0,0,0.18); }
  :root.day #cursor .ring { border-color: rgba(201,150,42,0.5); }
  :root.day #cursor.hover .ring { border-color: rgba(201,150,42,0.8); }
  :root.day #cursor-glow { background: radial-gradient(circle, rgba(201,150,42,0.10) 0%, rgba(201,150,42,0.04) 40%, transparent 70%); }

  /* ── Multi-project: sidebar switcher ─────────────────── */
  .proj-switch { margin-top: 6px; }
  .proj-switch-label { font-size: 7.5px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--dim); margin-bottom: 10px; }
  #projList { display: flex; flex-direction: column; }
  .proj-item { display: flex; align-items: baseline; gap: 11px; padding: 9px 0; border-bottom: 0.5px solid var(--border); cursor: none; transition: color 0.2s; }
  .proj-item .pnum { font-size: 8px; letter-spacing: 0.1em; color: var(--dim); min-width: 18px; }
  .proj-item .pname { font-size: 11px; letter-spacing: 0.04em; color: var(--bone); transition: color 0.2s; }
  .proj-item:hover .pname, .proj-item.active .pname, .proj-item.active .pnum { color: var(--accent); }
  /* ── Single-image page column ────────────────────────── */
  .cp-page { flex: 0 0 auto; align-items: center; justify-content: center; padding: 64px 30px 44px; background: var(--bg); }
  .cp-page img { height: 76%; width: auto; max-width: 80vw; object-fit: contain; display: block; cursor: none; border-radius: 4px; box-shadow: 0 24px 60px rgba(0,0,0,0.5); transition: transform 0.3s; }
  :root.day .cp-page img { box-shadow: 0 24px 60px rgba(0,0,0,0.16); }
  .cp-page:hover img { transform: scale(1.012); }
</style>

/* ---- engine ---- */
const scroll=document.getElementById('scroll');
const dotsEl=document.getElementById('scroll-dots');
let allImgs=[], wireEls=[], activeProject=0;
const mk=(tag,cls,html)=>{const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;};

function buildPairColumn(s,i){
  const col=mk('div','cp cp-screen');
  col.appendChild(mk('div','screen-name-bar',`<span class="screen-name-chip">${String(i+1).padStart(2,'0')} — ${s.name}</span>`));
  const pair=mk('div','screen-pair');
  const protoHalf=mk('div','screen-half proto-half');
  const protoImg=document.createElement('img');
  protoImg.src=s.proto; protoImg.loading='lazy'; protoImg.style.cursor='none';
  const pIdx=allImgs.length; allImgs.push(s.proto); protoImg.onclick=()=>openLB(pIdx);
  protoHalf.appendChild(protoImg); protoHalf.appendChild(mk('div','screen-label','Prototype'));
  const dv=mk('div','wire-divider',`<div class="wire-divider-line"></div><span class="wire-divider-label">Wireframe</span><div class="wire-divider-line"></div>`);
  const wireHalf=mk('div','screen-half wire-half');
  wireHalf.appendChild(mk('div','screen-label','Blueprint'));
  if(s.wire){
    const wireImg=document.createElement('img');
    wireImg.dataset.dark=s.wire; wireImg.dataset.light=s.wireLight||s.wire;
    wireImg.src=document.documentElement.classList.contains('day')?wireImg.dataset.light:wireImg.dataset.dark;
    wireImg.loading='lazy'; wireImg.style.cursor='none';
    const wIdx=allImgs.length; allImgs.push(wireImg.src);
    wireEls.push({el:wireImg,idx:wIdx}); wireImg.onclick=()=>openLB(wIdx);
    wireHalf.appendChild(wireImg);
  } else {
    wireHalf.style.opacity='0.2';
    wireHalf.innerHTML+='<span style="font-size:8px;letter-spacing:0.2em;text-transform:uppercase;color:var(--dim)">Coming Soon</span>';
  }
  pair.appendChild(protoHalf); pair.appendChild(wireHalf);
  col.appendChild(pair); col.appendChild(dv);
  return col;
}
function buildPageColumn(p,i){
  const col=mk('div','cp cp-page');
  col.appendChild(mk('div','screen-name-bar',`<span class="screen-name-chip">${String(i+1).padStart(2,'0')} — ${p.name}</span>`));
  const img=document.createElement('img');
  img.src=p.img; img.loading='lazy'; img.style.cursor='none';
  const idx=allImgs.length; allImgs.push(p.img); img.onclick=()=>openLB(idx);
  col.appendChild(img);
  return col;
}
function buildDots(){
  const cols=scroll.querySelectorAll('.cp, .project-intro');
  dotsEl.innerHTML='';
  cols.forEach((c,i)=>{
    const d=mk('div','sdot'+(i===0?' active':'')); d.style.cursor='none';
    d.addEventListener('click',()=>scroll.scrollTo({left:c.offsetLeft,behavior:'smooth'}));
    dotsEl.appendChild(d);
  });
}
function renderProject(idx){
  activeProject=idx; const pr=projects[idx];
  document.getElementById('sbMeta').innerHTML=pr.meta;
  document.getElementById('sbDesc').innerHTML=pr.desc;
  document.getElementById('sbTags').innerHTML=pr.tags.map(t=>`<span class="tag">${t}</span>`).join('');
  document.querySelectorAll('.proj-item').forEach((it,i)=>it.classList.toggle('active',i===idx));
  scroll.innerHTML=''; allImgs=[]; wireEls=[];
  const firstImg = pr.type==='pairs' ? pr.screens[0].proto : pr.pages[0].img;
  scroll.appendChild(mk('div','project-intro',
    `<div class="bg-cover" style="background-image:url('${firstImg}')"></div>`+
    `<div class="pi-num">${pr.num} &mdash; UI/UX</div>`+
    `<div class="pi-name">${pr.pi.name}</div>`+
    `<div class="pi-type">${pr.pi.sub}</div>`));
  if(pr.brief && pr.brief.length){
    const txt=mk('div','cp cp-text');
    txt.innerHTML=pr.brief.map(b=>`<div><span class="cpt-label">${b.label}</span><p class="cpt-body">${b.body}</p></div>`).join('');
    scroll.appendChild(txt);
  }
  if(pr.type==='pairs') pr.screens.forEach((sc,i)=>scroll.appendChild(buildPairColumn(sc,i)));
  else pr.pages.forEach((pg,i)=>scroll.appendChild(buildPageColumn(pg,i)));
  buildDots();
  scroll.scrollTo({left:0,behavior:'auto'});
}

/* project switcher */
const projList=document.getElementById('projList');
projects.forEach((pr,i)=>{
  const it=mk('div','proj-item'+(i===0?' active':''),`<span class="pnum">${pr.num}</span><span class="pname">${pr.name}</span>`);
  it.addEventListener('click',()=>renderProject(i));
  projList.appendChild(it);
});

/* scroll: wheel drives horizontal, sync dots */
scroll.addEventListener('wheel',(e)=>{ if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){ scroll.scrollBy({left:e.deltaY,behavior:'auto'}); e.preventDefault(); } },{passive:false});
scroll.addEventListener('scroll',()=>{
  const cols=scroll.querySelectorAll('.cp, .project-intro'); const sl=scroll.scrollLeft;
  let active=0,min=Infinity; cols.forEach((c,i)=>{const d=Math.abs(c.offsetLeft-sl); if(d<min){min=d;active=i;}});
  dotsEl.querySelectorAll('.sdot').forEach((d,i)=>d.classList.toggle('active',i===active));
});

/* cursor */
const cursor=document.getElementById('cursor'),glow=document.getElementById('cursor-glow');
const dot=cursor.querySelector('.dot'),ring=cursor.querySelector('.ring');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
document.addEventListener('mouseover',e=>{ cursor.classList.toggle('hover', !!e.target.closest('img,.theme-toggle,.proj-item,.nav-link,.soc-icon,.hdr-logo,.sdot,#lb-close,#lb-prev,#lb-next')); });
(function animate(){rx+=(mx-rx)*0.15;ry+=(my-ry)*0.15;dot.style.left=mx+'px';dot.style.top=my+'px';ring.style.left=rx+'px';ring.style.top=ry+'px';glow.style.left=mx+'px';glow.style.top=my+'px';requestAnimationFrame(animate);})();
document.addEventListener('mouseenter',()=>glow.style.opacity='1');
document.addEventListener('mouseleave',()=>glow.style.opacity='0');

/* theme */
function toggleTheme(){ const day=document.documentElement.classList.toggle('day'); wireEls.forEach(w=>{const src=day?w.el.dataset.light:w.el.dataset.dark; w.el.src=src; allImgs[w.idx]=src;}); }

/* lightbox */
let lbIdx=0;
function openLB(i){lbIdx=i;document.getElementById('lb-img').src=allImgs[i];document.getElementById('lb').classList.add('open');}
function closeLB(){document.getElementById('lb').classList.remove('open');}
function nextLB(){lbIdx=(lbIdx+1)%allImgs.length;document.getElementById('lb-img').src=allImgs[lbIdx];}
function prevLB(){lbIdx=(lbIdx-1+allImgs.length)%allImgs.length;document.getElementById('lb-img').src=allImgs[lbIdx];}
document.getElementById('lb').addEventListener('click',e=>{if(e.target===e.currentTarget)closeLB();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLB();if(e.key==='ArrowRight')nextLB();if(e.key==='ArrowLeft')prevLB();});

/* init */
renderProject(0);
</script>
