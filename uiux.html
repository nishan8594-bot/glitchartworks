<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glitch Artworks — UI/UX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">

<!-- Shared chrome: header, nav, social, day/night toggle, footer, cursor, orbs, grain, lightning protection, stars -->
<link rel="stylesheet" href="glitch-core.css">
<script>try{if(localStorage.getItem('glitch-theme')==='day')document.documentElement.classList.add('day');}catch(e){}</script>
<script>window.GLITCH={active:'uiux'};</script>
<script defer src="glitch-core.js"></script>
<style>
  :root {
    --bg: #080706;
    --bone: rgba(255,255,255,0.82);
    --dim: rgba(255,255,255,0.38);
    --accent: #fff34f;
    --accent-rgb: 255,243,79;
    --accent2: rgba(255,243,79,0.18);
    --border: rgba(255,255,255,0.06);
    --blue: #4a9eff;
    --sidebar: 320px;
    --panel-h: 680px;
  }
  :root.day {
    --bg: #f8f6f1;
    --bone: rgba(0,0,0,0.8);
    --dim: rgba(0,0,0,0.4);
    --accent: #ffbe35;
    --accent-rgb: 255,190,53;
    --accent2: rgba(255,190,53,0.12);
    --border: rgba(0,0,0,0.08);
    --blue: #1a73e8;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: var(--bg); color: var(--bone); font-family: "Syne", sans-serif; overflow: hidden; cursor: none; }
  .bg-grid { position: fixed; inset: 0; z-index: 0; pointer-events: none; background-image: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 52px 52px; }
  :root.day .bg-grid { background-image: radial-gradient(circle, rgba(0,0,0,0.04) 1px, transparent 1px); }

  /* Layout */
  #app { display: flex; width: 100vw; height: 100%; position: relative; z-index: 1; padding-top: 50px; padding-bottom: 0; }

  /* Sidebar */
  #sidebar { width: var(--sidebar); height: 100%; flex-shrink: 0; border-right: 0.5px solid var(--border); display: flex; flex-direction: column; padding: 40px 28px 28px; overflow: hidden; position: relative; z-index: 2; background: var(--bg); }
  .sidebar-label { font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase; color: rgba(var(--accent-rgb),0.62); margin-bottom: 6px; }
  .sidebar-title { font-size: 28px; font-weight: 700; line-height: 1.1; margin-bottom: 4px; color: var(--bone); }
  .sidebar-title em { font-style: italic; font-family: "Cormorant Garamond", serif; font-weight: 300; }
  .sidebar-meta { font-size: 9.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--dim); margin-bottom: 28px; }
  .sidebar-desc { font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 300; font-size: 15.5px; line-height: 1.75; letter-spacing: 0.02em; color: rgba(255,255,255,0.55); margin-bottom: 24px; }
  :root.day .sidebar-desc { color: rgba(0,0,0,0.55); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 32px; }
  .tag { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; padding: 4px 9px; border: 0.5px solid rgba(var(--accent-rgb),0.25); color: rgba(var(--accent-rgb),0.68); border-radius: 2px; }
  .sidebar-screens { flex: 1; overflow: hidden; }
  .sidebar-screens-label { font-size: 9px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--dim); margin-bottom: 10px; }
  .screen-list { display: flex; flex-direction: column; gap: 2px; }
  .screen-dot { width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--accent); flex-shrink: 0; margin-top: 2px; transition: background 0.2s; }
  .screen-dot.active { background: var(--accent); }
  .screen-item { display: flex; align-items: flex-start; gap: 10px; padding: 6px 0; border-bottom: 0.5px solid var(--border); cursor: none; }
  .screen-item:hover .screen-dot { background: var(--accent); }
  .screen-num { font-size: 10.5px; letter-spacing: 0.16em; color: var(--dim); min-width: 26px; }
  .screen-name { font-family: "Cormorant Garamond", serif; font-size: 15px; font-weight: 300; letter-spacing: 0.02em; color: var(--bone); }
  .sidebar-footer { padding-top: 20px; border-top: 0.5px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .footer-copy { font-size: 9px; letter-spacing: 0.16em; color: var(--dim); }

  /* Canvas */
  #canvas { flex: 1; overflow: hidden; height: 100%; display: flex; flex-direction: column; }
  .project-scroll { display: flex; height: 100%; transition: transform 0.7s cubic-bezier(0.16,1,0.3,1); will-change: transform; }

  /* Intro panel */
  .project-intro { position: relative; width: calc(100vw - var(--sidebar)); flex-shrink: 0; height: 100%; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 48px 52px; border-right: 0.5px solid var(--border); }
  .bg-cover { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0.92; z-index: 0; }
  .bg-cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 0%, transparent 35%, rgba(8,7,6,0.55) 58%, rgba(8,7,6,0.85) 75%, rgba(8,7,6,0.95) 100%); }
  :root.day .bg-cover::after { background: linear-gradient(to bottom, transparent 0%, transparent 40%, rgba(8,7,6,0.5) 62%, rgba(8,7,6,0.82) 78%, rgba(8,7,6,0.92) 100%); }
  .project-intro > *:not(.bg-cover) { position: relative; z-index: 1; }
  .project-intro::before { content: ""; position: absolute; top: 48px; left: 52px; right: 52px; height: 0.5px; background: linear-gradient(90deg, rgba(var(--accent-rgb),0.35), transparent); z-index: 2; }
  .pi-num { font-size: 10.5px; letter-spacing: 0.3em; text-transform: uppercase; color: rgba(var(--accent-rgb),0.7); margin-bottom: 10px; display: block; }
  .pi-name { font-family: "Cormorant Garamond", serif; font-weight: 300; font-size: clamp(54px,7vw,112px); line-height: 0.9; color: #fff; }
  .pi-name em { font-style: italic; color: var(--accent); }
  .pi-type { margin-top: 22px; font-size: 9.5px; letter-spacing: 0.25em; text-transform: uppercase; color: rgba(255,255,255,0.45); }

  /* Screen column panel */
  .cp { position: relative; height: 100%; border-right: 0.5px solid var(--border); flex-shrink: 0; overflow: hidden; display: flex; flex-direction: column; }
  .cp-screen { width: 300px; }

  /* Screen pair: proto on top, wireframe below */
  .screen-pair { display: flex; flex-direction: column; height: 100%; }
  .screen-half { flex: 1; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; background: var(--bg); }
  .screen-half.proto-half { border-bottom: 0.5px solid var(--border); }
  .screen-half img { max-width: 90%; max-height: 95%; object-fit: contain; display: block; cursor: none; transition: transform 0.3s; }
  .screen-half:hover img { transform: scale(1.02); }
  .screen-label { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--dim); z-index: 2; }

  /* Screen name header */
  .screen-name-bar { position: absolute; top: 0; left: 0; right: 0; z-index: 3; padding: 10px 12px; display: flex; justify-content: center; }
  .screen-name-chip { font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--bone); background: var(--bg); border: 0.5px solid var(--border); padding: 5px 11px; border-radius: 2px; }

  /* Text panel */
  .cp-text { width: 360px; padding: 48px 40px; display: flex; flex-direction: column; justify-content: center; gap: 24px; background: var(--bg); }
  :root.day .cp-text { background: #ffffff; border-right: 0.5px solid rgba(0,0,0,0.08); }
  .cpt-label { font-size: 9.5px; letter-spacing: 0.25em; text-transform: uppercase; color: rgba(var(--accent-rgb),0.6); margin-bottom: 6px; display: block; }
  .cpt-body { font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 15.5px; font-weight: 300; line-height: 1.85; color: rgba(255,255,255,0.55); }
  :root.day .cpt-body { color: rgba(0,0,0,0.7); }
  :root.day .cpt-label { color: rgba(var(--accent-rgb),0.65); }

  /* Wireframe divider label */
  .wire-divider { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); z-index: 4; display: flex; align-items: center; gap: 8px; padding: 0 12px; pointer-events: none; }
  .wire-divider-line { flex: 1; height: 0.5px; background: var(--border); }
  .wire-divider-label { font-size: 9px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }

  /* Lightbox */
  #lb { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 9000; align-items: center; justify-content: center; }
  #lb.open { display: flex; }
  #lb-img { max-width: 88vw; max-height: 88vh; object-fit: contain; }
  #lb-close { position: absolute; top: 24px; right: 32px; font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: rgba(255,255,255,0.3); cursor: none; }
  #lb-close:hover { color: #fff; }
  #lb-prev, #lb-next { position: absolute; top: 50%; transform: translateY(-50%); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.2); cursor: none; padding: 16px; }
  #lb-prev { left: 20px; } #lb-next { right: 20px; }
  #lb-prev:hover, #lb-next:hover { color: #fff; }

  /* Progress indicator uses the shared .progress / .prog-dot from glitch-core.css */

  /* ── Multi-project: sidebar switcher ─────────────────── */
  .proj-switch { margin-top: 6px; }
  .proj-switch-label { font-size: 9px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--dim); margin-bottom: 10px; }
  #projList { display: flex; flex-direction: column; }
  .proj-item { display: flex; align-items: baseline; gap: 11px; padding: 9px 0; border-bottom: 0.5px solid var(--border); cursor: none; transition: color 0.2s; }
  .proj-item .pnum { font-size: 10.5px; letter-spacing: 0.16em; color: var(--dim); min-width: 24px; }
  .proj-item .pname { font-family: "Cormorant Garamond", serif; font-size: 17px; font-weight: 300; letter-spacing: 0.02em; color: var(--bone); transition: color 0.2s; }
  .proj-item .star-badge { margin-left: auto; }
  .proj-item:hover .pname, .proj-item.active .pname, .proj-item.active .pnum { color: var(--accent); }
  /* ── Single-image page column ────────────────────────── */
  .cp-page { flex: 0 0 auto; align-items: center; justify-content: center; padding: 64px 30px 44px; background: var(--bg); }
  .cp-page img { height: 76%; width: auto; max-width: 80vw; object-fit: contain; display: block; cursor: none; border-radius: 4px; box-shadow: 0 24px 60px rgba(0,0,0,0.5); transition: transform 0.3s; }
  :root.day .cp-page img { box-shadow: 0 24px 60px rgba(0,0,0,0.16); }
  .cp-page:hover img { transform: scale(1.012); }
</style>
</head>
<body>

<div class="bg-grid"></div>

<div id="app">
  <div id="sidebar">
    <div class="sidebar-label">Selected Work</div>
    <div class="sidebar-title">UI<em>/UX</em></div>
    <div class="sidebar-meta" id="sbMeta"></div>
    <div class="sidebar-desc" id="sbDesc"></div>
    <div class="tags" id="sbTags"></div>
    <div class="proj-switch">
      <div class="proj-switch-label">Projects</div>
      <div id="projList"></div>
    </div>
  </div>

  <div id="canvas">
    <div class="project-scroll" id="scroll"></div>
  </div>
</div>

<!-- Lightbox -->
<div id="lb">
  <div id="lb-close" onclick="closeLB()">Close &times;</div>
  <div id="lb-prev" onclick="prevLB()">&#8592; Prev</div>
  <img id="lb-img" src="" alt="">
  <div id="lb-next" onclick="nextLB()">Next &#8594;</div>
</div>

<div class="progress" id="progress"></div>


<script>
/* ---- Fuel Me image consts (externalized webp) ---- */
const fm_p0="uiux-assets/assets/uiux/fm_p0.webp",fm_w0="uiux-assets/assets/uiux/fm_w0.webp",fm_w0_light="uiux-assets/assets/uiux/fm_w0_light.webp",
 fm_p1="uiux-assets/assets/uiux/fm_p1.webp",fm_w1="uiux-assets/assets/uiux/fm_w1.webp",fm_w1_light="uiux-assets/assets/uiux/fm_w1_light.webp",
 fm_p2="uiux-assets/assets/uiux/fm_p2.webp",fm_w2="uiux-assets/assets/uiux/fm_w2.webp",fm_w2_light="uiux-assets/assets/uiux/fm_w2_light.webp",
 fm_p3="uiux-assets/assets/uiux/fm_p3.webp",fm_w3="uiux-assets/assets/uiux/fm_w3.webp",fm_w3_light="uiux-assets/assets/uiux/fm_w3_light.webp",
 fm_p4="uiux-assets/assets/uiux/fm_p4.webp",fm_w4="uiux-assets/assets/uiux/fm_w4.webp",fm_w4_light="uiux-assets/assets/uiux/fm_w4_light.webp",
 fm_p5="uiux-assets/assets/uiux/fm_p5.webp",fm_w5="uiux-assets/assets/uiux/fm_w5.webp",fm_w5_light="uiux-assets/assets/uiux/fm_w5_light.webp",
 fm_p6="uiux-assets/assets/uiux/fm_p6.webp",fm_w6="uiux-assets/assets/uiux/fm_w6.webp",fm_w6_light="uiux-assets/assets/uiux/fm_w6_light.webp",
 fm_p7="uiux-assets/assets/uiux/fm_p7.webp",fm_w7="uiux-assets/assets/uiux/fm_w7.webp",fm_w7_light="uiux-assets/assets/uiux/fm_w7_light.webp",
 fm_p8="uiux-assets/assets/uiux/fm_p8.webp",fm_w8="uiux-assets/assets/uiux/fm_w8.webp",fm_w8_light="uiux-assets/assets/uiux/fm_w8_light.webp",
 fm_p9="uiux-assets/assets/uiux/fm_p9.webp",fm_w9="uiux-assets/assets/uiux/fm_w9.webp",fm_w9_light="uiux-assets/assets/uiux/fm_w9_light.webp",
 fm_p10="uiux-assets/assets/uiux/fm_p10.webp",fm_w10=null,fm_w10_light=null,
 fm_hero="uiux-assets/assets/uiux/fm_hero.webp";

const fuelScreens=[
 // proto files were mis-numbered against the screens; remapped so each prototype
 // sits with its matching wireframe (wireframe numbering was already correct).
 {name:"Splash",proto:fm_p10,wire:fm_w0,wireLight:fm_w0_light},
 {name:"Sign In",proto:fm_p9,wire:fm_w1,wireLight:fm_w1_light},
 {name:"Sign Up",proto:fm_p1,wire:fm_w2,wireLight:fm_w2_light},
 {name:"Home",proto:fm_p2,wire:fm_w3,wireLight:fm_w3_light},
 {name:"Restaurant",proto:fm_p3,wire:fm_w4,wireLight:fm_w4_light},
 {name:"Checkout",proto:fm_p5,wire:fm_w5,wireLight:fm_w5_light},
 {name:"Delivery Progress",proto:fm_p4,wire:fm_w6,wireLight:fm_w6_light},
 {name:"Order History",proto:fm_p6,wire:fm_w7,wireLight:fm_w7_light},
 {name:"Profile",proto:fm_p7,wire:fm_w8,wireLight:fm_w8_light},
 {name:"Cart",proto:fm_p8,wire:fm_w9,wireLight:fm_w9_light},
 {name:"Favourites",proto:fm_p0,wire:fm_w10,wireLight:fm_w10_light}
];

const projects=[
 { name:"Fuel Me", num:"01", type:"pairs",
   hero: fm_hero,
   pi:{name:'Fuel<em>Me</em>', sub:"Food Delivery App &middot; UX Design"},
   meta:"Fuel Me &middot; Food Delivery App",
   desc:"A food delivery app designed for Malaysians — built around speed, local variety, and a frictionless order experience. Each screen pairs a working Figma prototype with its blueprint wireframe.",
   tags:["App Design","Wireframing","Prototyping","UX Research"],
   brief:[
     {label:"The Brief",body:"Design a full food delivery app for Malaysians — fast, local, and accessible. From splash screen to order history, every flow built from scratch."},
     {label:"The Problem",body:"Existing apps don't cater to the diversity of Malaysian hawker culture. Users struggle to discover local favourites and navigate multi-restaurant orders."},
     {label:"The Solution",body:"A clean dual-mode interface — Delivery, Dine-In, Pick-Up — with cuisine category filters, real-time delivery tracking, and a modular cart supporting multiple restaurants."}
   ],
   screens: fuelScreens },

 { name:"Tech Future Camp", num:"02", type:"pages",
   pi:{name:'Tech&nbsp;Future <em>Camp</em>', sub:"Event Landing Site &middot; Kids Coding Camp"},
   meta:"Tech Future Camp &middot; Event Site",
   desc:"A landing site for a children's coding &amp; robotics camp — seven full-page layouts spanning the hero, agenda, speakers and registration flow.",
   tags:["Landing Page","Web Design","Event Branding"],
   brief:[{label:"The Brief",body:"Design a complete event landing site for a kids' tech camp — energetic and playful, guiding parents cleanly from first interest through to registration."}],
   pages:[
     {name:"Landing",img:"uiux-assets/assets/uiux/camp1.webp"},
     {name:"About",img:"uiux-assets/assets/uiux/camp2.webp"},
     {name:"Agenda",img:"uiux-assets/assets/uiux/camp3.webp"},
     {name:"Guests",img:"uiux-assets/assets/uiux/camp4.webp"},
     {name:"Why Join Us",img:"uiux-assets/assets/uiux/camp5.webp"},
     {name:"Highlights",img:"uiux-assets/assets/uiux/camp6.webp"},
     {name:"Register",img:"uiux-assets/assets/uiux/camp7.webp"}
   ] },

 { name:"SmartStudy Tablet", num:"03", type:"pages",
   pi:{name:'Smart<em>Study</em>', sub:"Product Landing Site &middot; EdTech"},
   meta:"SmartStudy Tablet &middot; Product Site",
   desc:"A product landing site for an affordable learning tablet aimed at Malaysian students — seven pages from hero through to pricing and contact.",
   tags:["Landing Page","Product Design","Marketing"],
   brief:[{label:"The Brief",body:"Build a product landing site for an affordable learning tablet — soft, trustworthy and parent-facing, leading clearly toward purchase."}],
   pages:[
     {name:"Landing",img:"uiux-assets/assets/uiux/tablet1.webp"},
     {name:"About",img:"uiux-assets/assets/uiux/tablet2.webp"},
     {name:"Benefits",img:"uiux-assets/assets/uiux/tablet3.webp"},
     {name:"How It Works",img:"uiux-assets/assets/uiux/tablet4.webp"},
     {name:"Testimonials",img:"uiux-assets/assets/uiux/tablet5.webp"},
     {name:"Pricing",img:"uiux-assets/assets/uiux/tablet6.webp"},
     {name:"Contact",img:"uiux-assets/assets/uiux/tablet7.webp"}
   ] },

 { name:"PETRONAS Mesra Cafe", num:"04", type:"pages",
   pi:{name:'Mesra&nbsp;<em>Caf&eacute;</em>', sub:"Promotional Banner &middot; F&amp;B"},
   meta:"PETRONAS Mesra Caf&eacute; &middot; Promo",
   desc:"A single promotional banner for PETRONAS Mesra Caf&eacute; — appetite-led and on-brand, built around the weekend and loyalty offers.",
   tags:["Banner","Promotional","Brand Layout"],
   brief:[{label:"The Brief",body:"A single promotional banner for PETRONAS Mesra Cafe — appetite-driven and on-brand, anchored by a bold food-led hero and the loyalty/weekend offers."}],
   pages:[{name:"Promo",img:"uiux-assets/assets/uiux/petronas1.webp"}] }
];

/* ---- engine ---- */
const scroll=document.getElementById('scroll');
const progressEl=document.getElementById('progress');
let allImgs=[], wireEls=[], activeProject=0;
let panelCols=[], activePanel=0;
const mk=(tag,cls,html)=>{const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;};

function buildPairColumn(s,i){
  const col=mk('div','cp cp-screen');
  col.appendChild(mk('div','screen-name-bar',`<span class="screen-name-chip">${String(i+1).padStart(2,'0')} — ${s.name}</span>`));
  const pair=mk('div','screen-pair');
  const protoHalf=mk('div','screen-half proto-half');
  const protoImg=document.createElement('img');
  protoImg.src=s.proto; protoImg.loading='lazy'; protoImg.style.cursor='none';
  const pIdx=allImgs.length; allImgs.push(s.proto); protoImg.onclick=()=>openLB(pIdx);
  protoHalf.appendChild(protoImg); protoHalf.appendChild(mk('div','screen-label','Prototype'));
  const dv=mk('div','wire-divider',`<div class="wire-divider-line"></div><span class="wire-divider-label">Wireframe</span><div class="wire-divider-line"></div>`);
  const wireHalf=mk('div','screen-half wire-half');
  wireHalf.appendChild(mk('div','screen-label','Blueprint'));
  if(s.wire){
    const wireImg=document.createElement('img');
    wireImg.dataset.dark=s.wire; wireImg.dataset.light=s.wireLight||s.wire;
    wireImg.src=document.documentElement.classList.contains('day')?wireImg.dataset.light:wireImg.dataset.dark;
    wireImg.loading='lazy'; wireImg.style.cursor='none';
    const wIdx=allImgs.length; allImgs.push(wireImg.src);
    wireEls.push({el:wireImg,idx:wIdx}); wireImg.onclick=()=>openLB(wIdx);
    wireHalf.appendChild(wireImg);
  } else {
    wireHalf.style.opacity='0.2';
    wireHalf.innerHTML+='<span style="font-size:8px;letter-spacing:0.2em;text-transform:uppercase;color:var(--dim)">Coming Soon</span>';
  }
  pair.appendChild(protoHalf); pair.appendChild(wireHalf);
  col.appendChild(pair); col.appendChild(dv);
  return col;
}
function buildPageColumn(p,i){
  const col=mk('div','cp cp-page');
  col.appendChild(mk('div','screen-name-bar',`<span class="screen-name-chip">${String(i+1).padStart(2,'0')} — ${p.name}</span>`));
  const img=document.createElement('img');
  img.src=p.img; img.loading='lazy'; img.style.cursor='none';
  const idx=allImgs.length; allImgs.push(p.img); img.onclick=()=>openLB(idx);
  col.appendChild(img);
  return col;
}
function goPanel(i){
  if(!panelCols.length) return;
  i=Math.max(0,Math.min(panelCols.length-1,i));
  activePanel=i;
  scroll.style.transform=`translateX(${-panelCols[i].offsetLeft}px)`;
  progressEl.querySelectorAll('.prog-dot').forEach((d,k)=>d.classList.toggle('active',k===i));
}
function buildDots(){
  panelCols=[...scroll.querySelectorAll('.cp, .project-intro')];
  progressEl.innerHTML='';
  panelCols.forEach((c,i)=>{
    const d=mk('div','prog-dot'+(i===0?' active':''));
    d.setAttribute('data-cursor-hover','');
    d.addEventListener('click',()=>goPanel(i));
    progressEl.appendChild(d);
  });
}
function renderProject(idx){
  activeProject=idx; const pr=projects[idx];
  document.getElementById('sbMeta').innerHTML=pr.meta;
  document.getElementById('sbDesc').innerHTML=pr.desc;
  document.getElementById('sbTags').innerHTML=pr.tags.map(t=>`<span class="tag">${t}</span>`).join('');
  document.querySelectorAll('.proj-item').forEach((it,i)=>it.classList.toggle('active',i===idx));
  scroll.innerHTML=''; allImgs=[]; wireEls=[];
  const firstImg = pr.hero ? pr.hero : (pr.type==='pairs' ? pr.screens[0].proto : pr.pages[0].img);
  scroll.appendChild(mk('div','project-intro',
    `<div class="bg-cover" style="background-image:url('${firstImg}')"></div>`+
    `<div class="pi-num">${pr.num} &mdash; UI/UX</div>`+
    `<div class="pi-name">${pr.pi.name}</div>`+
    `<div class="pi-type">${pr.pi.sub}</div>`));
  if(pr.brief && pr.brief.length){
    const txt=mk('div','cp cp-text');
    txt.innerHTML=pr.brief.map(b=>`<div><span class="cpt-label">${b.label}</span><p class="cpt-body">${b.body}</p></div>`).join('');
    scroll.appendChild(txt);
  }
  if(pr.type==='pairs') pr.screens.forEach((sc,i)=>scroll.appendChild(buildPairColumn(sc,i)));
  else pr.pages.forEach((pg,i)=>scroll.appendChild(buildPageColumn(pg,i)));
  buildDots();
  activePanel=0;
  scroll.style.transition='none';
  scroll.style.transform='translateX(0px)';
  requestAnimationFrame(()=>{ scroll.style.transition=''; });
}

/* project switcher */
const projList=document.getElementById('projList');
projects.forEach((pr,i)=>{
  const it=mk('div','proj-item'+(i===0?' active':''),`<span class="pnum">${pr.num}</span><span class="pname">${pr.name}</span><span class="star-slot" data-star-type="hw"></span>`);
  it.addEventListener('click',()=>renderProject(i));
  projList.appendChild(it);
});

function hydrateAssignmentStars(){
  if(!window.GLITCH || !window.GLITCH.makeStar) return;
  document.querySelectorAll('[data-star-type="hw"]').forEach(slot=>{
    if(slot.querySelector('.star-badge')) return;
    slot.appendChild(window.GLITCH.makeStar('hw'));
  });
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',hydrateAssignmentStars);
else hydrateAssignmentStars();

/* scroll: wheel/touch step one panel per tick via transform (matches other pages) */
let wLock=false;
scroll.addEventListener('wheel',(e)=>{
  const horiz=Math.abs(e.deltaX)>Math.abs(e.deltaY);
  const delta=horiz?e.deltaX:e.deltaY;
  if(Math.abs(delta)<2) return;
  e.preventDefault();
  if(wLock) return; wLock=true; setTimeout(()=>{wLock=false;},620);
  goPanel(activePanel+(delta>0?1:-1));
},{passive:false});
let tsx=0,tsy=0;
scroll.addEventListener('touchstart',(e)=>{tsx=e.touches[0].clientX;tsy=e.touches[0].clientY;},{passive:true});
scroll.addEventListener('touchend',(e)=>{
  const dx=e.changedTouches[0].clientX-tsx, dy=e.changedTouches[0].clientY-tsy;
  if(Math.abs(dx)<40 && Math.abs(dy)<40) return;
  if(Math.abs(dx)>=Math.abs(dy)){ goPanel(activePanel+(dx<0?1:-1)); } else { goPanel(activePanel+(dy<0?1:-1)); }
},{passive:true});

/* cursor hover feedback — the cursor element itself is owned by glitch-core.js;
   here we just flag hover for the gallery-specific interactive elements it doesn't know about */
(function wireHover(){
  function run(){
    const cur=document.getElementById('cursor');
    if(!cur) return; // touch / no-cursor device
    document.addEventListener('mouseover',e=>{
      if(e.target.closest('img,.proj-item,.prog-dot,#lb-close,#lb-prev,#lb-next')) cur.classList.add('hover');
    });
    document.addEventListener('mouseout',e=>{
      if(e.target.closest('img,.proj-item,.prog-dot,#lb-close,#lb-prev,#lb-next')) cur.classList.remove('hover');
    });
  }
  if(document.readyState==='loading') window.addEventListener('DOMContentLoaded',()=>setTimeout(run,40),{once:true});
  else setTimeout(run,40);
})();

/* keep the active panel aligned when the viewport changes (transforms need this) */
let rzT;
window.addEventListener('resize',()=>{
  clearTimeout(rzT);
  rzT=setTimeout(()=>{
    if(!panelCols.length) return;
    const prev=scroll.style.transition; scroll.style.transition='none';
    scroll.style.transform=`translateX(${-panelCols[activePanel].offsetLeft}px)`;
    requestAnimationFrame(()=>{ scroll.style.transition=prev; });
  },120);
});

/* theme — glitch-core.js owns the day/night toggle; we listen for its event
   to swap the wireframe blueprints between their dark and light variants */
window.addEventListener('glitch:themechange',e=>{
  const day=e.detail.day;
  wireEls.forEach(w=>{const src=day?w.el.dataset.light:w.el.dataset.dark; w.el.src=src; allImgs[w.idx]=src;});
});

/* lightbox */
let lbIdx=0;
function openLB(i){lbIdx=i;document.getElementById('lb-img').src=allImgs[i];document.getElementById('lb').classList.add('open');}
function closeLB(){document.getElementById('lb').classList.remove('open');}
function nextLB(){lbIdx=(lbIdx+1)%allImgs.length;document.getElementById('lb-img').src=allImgs[lbIdx];}
function prevLB(){lbIdx=(lbIdx-1+allImgs.length)%allImgs.length;document.getElementById('lb-img').src=allImgs[lbIdx];}
document.getElementById('lb').addEventListener('click',e=>{if(e.target===e.currentTarget)closeLB();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLB();if(e.key==='ArrowRight')nextLB();if(e.key==='ArrowLeft')prevLB();});

/* init */
renderProject(0);
</script>
</body>
</html>
