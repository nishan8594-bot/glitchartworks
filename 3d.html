<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glitch Artworks — 3D</title>
<link rel="stylesheet" href="glitch-core.css">
<script>try{if(localStorage.getItem('glitch-theme')==='day')document.documentElement.classList.add('day');}catch(e){}</script>
<script>window.GLITCH={active:'3d'};</script>
<script defer src="glitch-core.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300;1,600&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}

/* ── THEME TOKENS — 3D = PURPLE ───────────────────────────────────────────── */
:root{
  --bg:#080706;
  --bone:#f0ebe0;
  --white:#fff;
  --muted:#a09a92;
  --pur:#7c5cbf;            /* category accent (matches home dot + nav) */
  --accent:#7c5cbf;        /* drives core chrome + cursor */
  --accent-day:#6a4fb0;    /* slightly deeper for legibility on light bg */
  --pur-bright:#a07fe6;     /* glow / hover / cursor variant */
  --pur-rgb:124,92,191;
  --purb-rgb:160,127,230;
  --cat:#a07fe6;            /* nav fallback (per-link --cat set by core) */
  --border:rgba(255,255,255,0.06);
  --sidebar:320px;
  /* chrome */
  --text:#ffffff;
  --text-muted:rgba(255,255,255,0.72);
  --gold:#ffbe35;
  --header-bg:rgba(8,8,8,0.0);
  --scan-col:rgba(124,92,191,0.12);
  --grain-opacity:0.4;
  --panel-bg:#080706;
  --intro-fade:rgba(8,7,6,0.95);
  transition:background 0.6s ease,color 0.6s ease;
}
:root.day{
  --bg:#f8f6f1;
  --bone:#1a1714;
  --muted:#7a6f66;
  --pur:#6a4fb0;
  --pur-bright:#7c5cbf;
  --border:rgba(13,12,11,0.10);
  --text:#000000;
  --text-muted:rgba(0,0,0,0.75);
  --header-bg:rgba(248,246,241,0.45);
  --scan-col:rgba(106,79,176,0.10);
  --grain-opacity:0.18;
  --panel-bg:#ece8e0;
  --intro-fade:rgba(248,246,241,0.94);
}

html,body{width:100%;height:100%;background:var(--bg);color:var(--bone);font-family:"Syne",sans-serif;overflow:hidden;cursor:none;transition:background 0.6s ease,color 0.6s ease;}

/* ── SHELL ─────────────────────────────────────────────────────────────────── */
.shell{position:fixed;top:50px;left:0;right:0;bottom:0;display:flex;z-index:1;}

/* ── SIDEBAR ───────────────────────────────────────────────────────────────── */
.sidebar{width:var(--sidebar);flex-shrink:0;height:100%;overflow-y:auto;overflow-x:hidden;border-right:0.5px solid var(--border);display:flex;flex-direction:column;scrollbar-width:none;}
.sidebar::-webkit-scrollbar{display:none;}
.sidebar-head{padding:24px 28px 18px;border-bottom:0.5px solid var(--border);flex-shrink:0;}
.sidebar-label{font-size:8px;letter-spacing:0.3em;text-transform:uppercase;color:rgba(var(--purb-rgb),0.6);margin-bottom:5px;}
.sidebar-title{font-family:"Cormorant Garamond",serif;font-weight:300;font-size:24px;color:var(--bone);line-height:1.1;}
.sidebar-title em{font-style:italic;color:var(--pur-bright);}

/* ── TABS ──────────────────────────────────────────────────────────────────── */
.tab{border-bottom:0.5px solid var(--border);overflow:hidden;flex-shrink:0;transition:background 0.3s;cursor:none;}
.tab:hover{background:rgba(var(--purb-rgb),0.04);}
.tab.active{background:rgba(var(--purb-rgb),0.06);}
.tab-header{display:flex;align-items:center;gap:10px;padding:13px 28px;cursor:none;position:relative;}
.tab-header::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1.5px;background:var(--pur-bright);transform:scaleY(0);transition:transform 0.35s cubic-bezier(0.16,1,0.3,1);box-shadow:0 0 8px var(--pur-bright);}
.tab.active .tab-header::before{transform:scaleY(1);}
.tab-num{font-size:9px;letter-spacing:0.2em;color:rgba(var(--purb-rgb),0.18);flex-shrink:0;transition:color 0.3s;}
.tab.active .tab-num{color:rgba(var(--purb-rgb),0.65);}
.tab-name{font-family:"Cormorant Garamond",serif;font-weight:300;font-size:16px;color:var(--text-muted);letter-spacing:0.02em;transition:color 0.3s;line-height:1.2;flex:1;opacity:0.55;}
.tab.active .tab-name{color:var(--bone);opacity:1;}
.tab-arrow{font-size:9px;color:rgba(var(--purb-rgb),0);transition:color 0.3s,transform 0.4s;flex-shrink:0;}
.tab.active .tab-arrow{color:rgba(var(--purb-rgb),0.55);transform:rotate(90deg);}
.tab-brief{max-height:0;overflow:hidden;transition:max-height 0.5s cubic-bezier(0.16,1,0.3,1),opacity 0.4s;opacity:0;padding:0 28px;}
.tab.active .tab-brief{max-height:300px;opacity:1;padding:0 28px 20px;}
.brief-type{font-size:8px;letter-spacing:0.25em;text-transform:uppercase;color:rgba(var(--purb-rgb),0.6);margin-bottom:7px;display:block;}
.brief-text{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:13px;font-weight:300;line-height:1.75;color:var(--text-muted);letter-spacing:0.02em;}
.brief-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
.brief-tag{font-size:8px;letter-spacing:0.18em;text-transform:uppercase;padding:3px 8px;border:0.5px solid rgba(var(--purb-rgb),0.22);color:rgba(var(--purb-rgb),0.6);}

/* ── CANVAS / SNAKE ────────────────────────────────────────────────────────── */
.canvas{flex:1;height:100%;overflow:hidden;position:relative;}
.snake{position:absolute;inset:0;overflow:hidden;}
.snake-inner{display:flex;flex-direction:column;transition:transform 0.9s cubic-bezier(0.16,1,0.3,1);will-change:transform;}
.project-row{width:100%;height:calc(100vh - 50px);flex-shrink:0;display:flex;flex-direction:row;overflow:hidden;position:relative;}
.project-scroll{display:flex;flex-direction:row;height:100%;transition:transform 0.8s cubic-bezier(0.16,1,0.3,1);will-change:transform;}

/* ── INTRO PANEL ───────────────────────────────────────────────────────────── */
.project-intro{width:calc(100vw - var(--sidebar));height:100%;flex-shrink:0;display:flex;flex-direction:column;justify-content:flex-end;padding:48px 52px;position:relative;border-right:0.5px solid var(--border);overflow:hidden;background:var(--panel-bg);}
.project-intro .bg-cover{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0.92;z-index:0;}
.project-intro .bg-cover.empty{background:radial-gradient(ellipse at 62% 28%,rgba(var(--pur-rgb),0.26) 0%,transparent 60%),var(--panel-bg);opacity:1;}
.project-intro .bg-cover.empty::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(var(--purb-rgb),0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--purb-rgb),0.05) 1px,transparent 1px);background-size:46px 46px;mask-image:radial-gradient(ellipse at 62% 28%,#000 0%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 62% 28%,#000 0%,transparent 70%);}
.project-intro .bg-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 0%,transparent 35%,var(--intro-fade) 75%,var(--intro-fade) 100%);}
.project-intro > *:not(.bg-cover){position:relative;z-index:1;}
.project-intro::before{content:"";position:absolute;top:48px;left:52px;right:52px;height:0.5px;background:linear-gradient(90deg,rgba(var(--purb-rgb),0.35),transparent);z-index:2;}
.pi-num{font-size:9px;letter-spacing:0.3em;text-transform:uppercase;color:rgba(var(--purb-rgb),0.6);margin-bottom:10px;display:block;}
.pi-name{font-family:"Cormorant Garamond",serif;font-weight:300;font-size:clamp(52px,7.5vw,108px);line-height:0.88;color:var(--bone);}
.pi-name em{font-style:italic;color:var(--pur-bright);}
.pi-meta{margin-top:28px;display:flex;gap:36px;flex-wrap:wrap;}
.pi-col-label{font-size:8px;letter-spacing:0.25em;text-transform:uppercase;color:rgba(127,114,104,0.7);margin-bottom:5px;display:block;}
.pi-col-val{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:13px;font-weight:300;color:var(--text-muted);line-height:1.7;max-width:300px;}
.pi-hint{position:absolute;bottom:48px;right:52px;display:flex;align-items:center;gap:8px;font-size:8px;letter-spacing:0.25em;text-transform:uppercase;color:rgba(127,114,104,0.45);animation:breathe 2.5s ease-in-out infinite;z-index:2;}
.pi-hint::after{content:"→";color:rgba(var(--purb-rgb),0.5);font-size:12px;}
@keyframes breathe{0%,100%{opacity:0.25}50%{opacity:0.6}}

/* ── CONTENT PANELS ────────────────────────────────────────────────────────── */
.cp{height:100%;flex-shrink:0;position:relative;overflow:hidden;border-right:0.5px solid var(--border);}
.cp img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0;filter:saturate(0.9) brightness(0.92);transition:transform 0.9s cubic-bezier(0.16,1,0.3,1),filter 0.6s;}
.cp:hover img{transform:scale(1.04);filter:saturate(1.05) brightness(1);}
/* full-fit panel: whole render visible, panel sizes to image at full height (no crop) */
.cp-art{height:100%;flex-shrink:0;position:relative;overflow:hidden;border-right:0.5px solid var(--border);background:var(--panel-bg);}
.cp-art img{height:100%;width:auto;display:block;filter:saturate(0.95) brightness(0.96);transition:filter 0.6s;cursor:none;}
.cp-art:hover img{filter:saturate(1.05) brightness(1);}
.cp-w{width:760px;}
.cp-m{width:560px;}
.cp-n{width:440px;}
.cp-split{width:400px;display:flex;flex-direction:column;}
.cp-split .half{flex:1;overflow:hidden;position:relative;border-bottom:0.5px solid var(--border);}
.cp-split .half:last-child{border-bottom:none;}
.cp-split .half img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(0.9) brightness(0.92);transition:filter 0.6s;}
.cp-split .half:hover img{filter:saturate(1.05) brightness(1);}
.cp-text{width:360px;padding:48px 40px;display:flex;flex-direction:column;justify-content:center;gap:24px;background:rgba(var(--pur-rgb),0.05);}
.cpt-label{font-size:8px;letter-spacing:0.25em;text-transform:uppercase;color:rgba(var(--purb-rgb),0.6);margin-bottom:6px;display:block;}
.cpt-body{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:13.5px;font-weight:300;line-height:1.85;color:var(--text-muted);}
.mglow{position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(var(--purb-rgb),0.22) 0%,transparent 65%);transform:translate(-50%,-50%);pointer-events:none;opacity:0;transition:opacity 0.3s;z-index:5;}

/* video panel — for turntables / motion (local src or hosted) */
.cp-vid{height:100%;flex-shrink:0;position:relative;overflow:hidden;border-right:0.5px solid var(--border);background:#000;}
.cp-vid video{height:100%;width:auto;display:block;}
.cp-vid.portrait{}

/* placeholder panel for empty projects */
.ph-panel{width:760px;height:100%;flex-shrink:0;border-right:0.5px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--panel-bg);position:relative;overflow:hidden;}
.ph-panel::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(var(--pur-rgb),0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--pur-rgb),0.05) 1px,transparent 1px);background-size:46px 46px;}
.ph-panel .ph-ico{position:relative;z-index:1;opacity:0.55;color:rgb(var(--purb-rgb));}
.ph-panel .ph-ico svg{width:44px;height:44px;}
.ph-panel span{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:18px;letter-spacing:0.06em;color:rgba(var(--purb-rgb),0.5);position:relative;z-index:1;}
.ph-panel small{font-size:8px;letter-spacing:0.25em;text-transform:uppercase;color:rgba(127,114,104,0.5);position:relative;z-index:1;}

/* ── LIGHTBOX ──────────────────────────────────────────────────────────────── */
#lb{display:none;position:fixed;inset:0;z-index:9998;background:rgba(6,4,10,0.97);backdrop-filter:blur(20px);align-items:center;justify-content:center;}
#lb.open{display:flex;}
#lb img{max-width:90vw;max-height:88vh;object-fit:contain;}
#lb-close{position:absolute;top:24px;right:32px;font-size:9px;letter-spacing:0.3em;text-transform:uppercase;color:rgba(255,255,255,0.3);cursor:none;transition:color 0.3s;}
#lb-close:hover{color:var(--pur-bright);}
#lb-prev,#lb-next{position:absolute;top:50%;transform:translateY(-50%);font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(255,255,255,0.2);cursor:none;transition:color 0.3s;padding:16px;user-select:none;}
#lb-prev{left:16px;}#lb-next{right:16px;}
#lb-prev:hover,#lb-next:hover{color:var(--pur-bright);}

@media(max-width:760px){
  .shell{flex-direction:column;}
  .sidebar{width:100%;height:auto;border-right:none;border-bottom:0.5px solid var(--border);}
}
</style>
</head>
<body>

<!-- ── SHELL: sidebar + canvas ────────────────────────────────────────────── -->
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="sidebar-label">Selected Work</div>
      <div class="sidebar-title">Work in <em>3D</em></div>
    </div>
  </aside>
  <div class="canvas" id="canvas">
    <div class="snake"><div class="snake-inner" id="snakeInner"></div></div>
  </div>
</div>

<!-- progress dots -->
<div class="progress" id="progress"></div>

<!-- lightbox -->
<div id="lb"><span id="lb-close" data-cursor-hover>Close ✕</span><span id="lb-prev" data-cursor-hover>‹ Prev</span><img id="lb-img" src="" alt=""><span id="lb-next" data-cursor-hover>Next ›</span></div>

<script>
/* ════════════════════════════════════════════════════════════════════════════
   IMAGE HELPERS
   - W()  : Wix CDN PNG   (use when the render is hosted on Wix → give me the key)
   - WJ() : Wix CDN JPG
   - or set src directly to a relative path e.g. "3d-assets/assets/3d/render-01.webp"
   ════════════════════════════════════════════════════════════════════════════ */
const W  = s => `https://static.wixstatic.com/media/${s}~mv2.png`;
const WJ = s => `https://static.wixstatic.com/media/${s}~mv2.jpg`;

/* ════════════════════════════════════════════════════════════════════════════
   PROJECTS  —  stubs. panels[] empty → renders "coming soon" placeholder.
   Drop real renders the same way the Art page does:

     {type:"img",   w:"cp-w|cp-m|cp-n", src: "3d-assets/.../render.webp" }
     {type:"split", imgs:[ src1, src2 ] }
     {type:"text",  label:"...", body:"..." }
     {type:"vid",   src:"...", portrait:false }     // turntable / motion

   star:  "rc" real client · "pw" personal work · "hw" class project
   ════════════════════════════════════════════════════════════════════════════ */

const IMGS = {
  /* e.g.  archVizHero:"3d-assets/assets/3d/archviz-hero.webp", */
};

const projects = [
  {
    num:"01", star:"pw",
    name:`Residential <em>Apartment</em>`,
    cover:"3d-assets/apt-hero.webp",
    type:"Architectural Visualisation · Interior",
    brief:"A residential apartment visualised end to end \u2014 from cut-through sectional elevations to photoreal interior renders. A navy-and-grey scheme with a bold geometric feature wall ties the living, dining, kitchen and bedrooms into one identity.",
    tags:["Arch-Viz","Interior","Lighting","Sectional","Photoreal"],
    meta:[
      {label:"Type",  val:"Residential interior"},
      {label:"Tools", val:"SketchUp \u00b7 rendering"},
      {label:"Focus", val:"Light, material, space"}
    ],
    panels:[
      {type:"img", src:"3d-assets/apt-hero.webp"},
      {type:"text"},
      {type:"img", src:"3d-assets/apt-render-wide.webp"},
      {type:"img", src:"3d-assets/apt-render-living.webp"},
      {type:"img", src:"3d-assets/apt-render-dusk.webp"},
      {type:"img", src:"3d-assets/apt-render-kitchen.webp"},
      {type:"vid", src:"3d-assets/apt-walkthrough.mp4", portrait:false},
      {type:"img", src:"3d-assets/apt-section-bedbath.webp"},
      {type:"img", src:"3d-assets/apt-section-bedrooms.webp"},
      {type:"img", src:"3d-assets/apt-section-unit.webp"}
    ]
  },
  {
    num:"02", star:"rc",
    name:`Nasi Kandar <em>SRB</em>`,
    cover:"3d-assets/srb-hero.webp",
    type:"Architectural Visualisation · F&B Interior",
    brief:"A built F&B fit-out for a real client \u2014 Restoran Nasi Kandar SRB in Kelana Jaya. Visualised from shopfront identity through to the dining hall: a living moss brand wall, Peranakan-style patterned tilework, backlit food menu boards and an open servery line.",
    tags:["Arch-Viz","F&B Interior","Branding","Lighting","Client"],
    meta:[
      {label:"Client",   val:"Restoran Nasi Kandar SRB"},
      {label:"Location", val:"Kelana Jaya"},
      {label:"Scope",    val:"Interior visualisation"}
    ],
    panels:[
      {type:"img", src:"3d-assets/srb-shopfront.webp"},
      {type:"text"},
      {type:"img", src:"3d-assets/srb-hero.webp"},
      {type:"img", src:"3d-assets/srb-dining-tv.webp"},
      {type:"img", src:"3d-assets/srb-entry.webp"},
      {type:"img", src:"3d-assets/srb-servery.webp"},
      {type:"img", src:"3d-assets/srb-drinks.webp"},
      {type:"img", src:"3d-assets/srb-entry-wide.webp"},
      {type:"vid", src:"3d-assets/srb-walkthrough.mp4", portrait:false}
    ]
  },
  {
    num:"03", star:"pw",
    name:`Warm <em>Minimal</em>`,
    cover:"3d-assets/classic-hero.webp",
    type:"Architectural Visualisation · Residential",
    brief:"A self-initiated home interior \u2014 a warm, lived-in take on minimalism. Marble, rattan, herringbone timber and soft light carry one calm material story across the living, dining, kitchen and bedroom.",
    tags:["Arch-Viz","Interior","Residential","Lighting","Materials"],
    meta:[
      {label:"Type",  val:"Residential interior"},
      {label:"Brief", val:"Personal / self-initiated"},
      {label:"Focus", val:"Warmth & material"}
    ],
    panels:[
      {type:"img", src:"3d-assets/classic-hero.webp"},
      {type:"text"},
      {type:"img", src:"3d-assets/classic-living-dining.webp"},
      {type:"img", src:"3d-assets/classic-living.webp"},
      {type:"img", src:"3d-assets/classic-dining-city.webp"},
      {type:"img", src:"3d-assets/classic-kitchen-dining.webp"},
      {type:"img", src:"3d-assets/classic-kitchen.webp"},
      {type:"img", src:"3d-assets/classic-bedroom.webp"},
      {type:"img", src:"3d-assets/classic-bedroom2.webp"},
      {type:"img", src:"3d-assets/classic-bedroom-wardrobe.webp"},
      {type:"vid", src:"3d-assets/classic-walkthrough.mp4", portrait:false}
    ]
  }
];

/* ════════════════════════════════════════════════════════════════════════════
   RENDER
   ════════════════════════════════════════════════════════════════════════════ */
const sidebar    = document.getElementById("sidebar");
const snakeInner = document.getElementById("snakeInner");
const progress   = document.getElementById("progress");
const allImgs    = {};   // pi -> [src,...] for the lightbox
let activeProject = 0, activePanel = 0;

const CUBE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"><path d="M12 2 21 7v10l-9 5-9-5V7z"/><path d="M12 2v10M12 12l9-5M12 12l-9-5M12 12v10"/></svg>';

function makeGlow(){ const g=document.createElement("div"); g.className="mglow"; return g; }
function attachGlow(el,g){
  el.addEventListener("mousemove",e=>{ const r=el.getBoundingClientRect(); g.style.left=(e.clientX-r.left)+"px"; g.style.top=(e.clientY-r.top)+"px"; g.style.opacity="1"; });
  el.addEventListener("mouseleave",()=>{ g.style.opacity="0"; });
}
function mkImg(src,pi,ii){
  const im=document.createElement("img");
  im.src=src; im.alt="";
  im.addEventListener("click",()=>openLB(pi,ii));
  return im;
}

/* sidebar tabs */
function buildSidebar(){
  projects.forEach((p,i)=>{
    const tab=document.createElement("div");
    tab.className="tab"+(i===0?" active":"");
    tab.innerHTML=`
      <div class="tab-header" data-cursor-hover>
        <span class="tab-num">${p.num}</span>
        <span class="tab-name">${p.name.replace(/<[^>]+>/g,"")}</span>
        <span class="tab-arrow">›</span>
      </div>
      <div class="tab-brief">
        <span class="brief-type">${p.type}</span>
        <p class="brief-text">${p.brief}</p>
        <div class="brief-tags">${(p.tags||[]).map(t=>`<span class="brief-tag">${t}</span>`).join("")}</div>
      </div>`;
    tab.querySelector(".tab-header").addEventListener("click",()=>goToProject(i));
    sidebar.appendChild(tab);
  });
}

/* canvas: one .project-row per project */
function buildCanvas(){
  projects.forEach((p,pi)=>{
    allImgs[pi]=[];
    const row=document.createElement("div");  row.className="project-row";  row.id="row-"+pi;
    const scroll=document.createElement("div"); scroll.className="project-scroll"; scroll.id="scroll-"+pi;

    /* intro panel */
    scroll.appendChild(buildIntro(p));

    /* content panels */
    if(!p.panels || p.panels.length===0){
      const ph=document.createElement("div");
      ph.className="ph-panel";
      ph.innerHTML=`<div class="ph-ico">${CUBE}</div><span>Renders coming soon</span><small>Project ${p.num}</small>`;
      scroll.appendChild(ph);
    } else {
      p.panels.forEach(panel=>{
        if(panel.type==="img"){
          const cp=document.createElement("div"); cp.className="cp-art"; cp.setAttribute("data-cursor-hover","");
          const ii=allImgs[pi].length; allImgs[pi].push(panel.src);
          cp.appendChild(mkImg(panel.src,pi,ii));
          const g=makeGlow(); cp.appendChild(g); attachGlow(cp,g);
          scroll.appendChild(cp);
        } else if(panel.type==="split"){
          const cp=document.createElement("div"); cp.className="cp cp-split";
          panel.imgs.forEach(src=>{
            const half=document.createElement("div"); half.className="half"; half.setAttribute("data-cursor-hover","");
            const ii=allImgs[pi].length; allImgs[pi].push(src);
            half.appendChild(mkImg(src,pi,ii));
            cp.appendChild(half);
          });
          scroll.appendChild(cp);
        } else if(panel.type==="vid"){
          const cp=document.createElement("div"); cp.className="cp-vid"+(panel.portrait?" portrait":"");
          const v=document.createElement("video");
          v.src=panel.src; v.autoplay=true; v.loop=true; v.muted=true; v.playsInline=true;
          v.setAttribute("playsinline",""); v.setAttribute("muted","");
          cp.appendChild(v);
          scroll.appendChild(cp);
        } else if(panel.type==="text"){
          const cp=document.createElement("div"); cp.className="cp-text";
          cp.innerHTML=`<div><span class="cpt-label">${panel.label||"The Brief"}</span><p class="cpt-body">${panel.body||p.brief}</p></div>`;
          scroll.appendChild(cp);
        }
      });
    }

    row.appendChild(scroll);
    snakeInner.appendChild(row);

    /* progress dot for this project */
    const dot=document.createElement("div");
    dot.className="prog-dot"+(pi===0?" active":""); dot.setAttribute("data-cursor-hover","");
    dot.addEventListener("click",()=>goToProject(pi));
    progress.appendChild(dot);
  });
}

function buildIntro(p){
  const intro=document.createElement("div"); intro.className="project-intro";
  const cover=document.createElement("div");
  cover.className="bg-cover"+(p.cover?"":" empty");
  if(p.cover) cover.style.backgroundImage=`url('${p.cover}')`;
  intro.appendChild(cover);
  const meta=(p.meta||[]).map(m=>`<div><span class="pi-col-label">${m.label}</span><span class="pi-col-val">${m.val}</span></div>`).join("");
  const body=document.createElement("div");
  body.innerHTML=`
    <span class="pi-num">Project ${p.num} — 3D</span>
    <h1 class="pi-name">${p.name}</h1>
    <div class="pi-meta">${meta}</div>
    <div class="pi-hint">Scroll to explore</div>`;
  intro.appendChild(body);
  return intro;
}

/* ── NAVIGATION ────────────────────────────────────────────────────────────── */
function goToProject(idx){
  idx=Math.max(0,Math.min(projects.length-1,idx));
  document.querySelectorAll(".tab").forEach((t,i)=>t.classList.toggle("active",i===idx));
  const tabs=document.querySelectorAll(".tab");
  if(tabs[idx]) tabs[idx].scrollIntoView({behavior:"smooth",block:"nearest"});
  const rowH=window.innerHeight-50;
  snakeInner.style.transform=`translateY(${-idx*rowH}px)`;
  if(activeProject!==idx){
    const old=document.getElementById("scroll-"+activeProject);
    if(old) old.style.transform="translateX(0)";
  }
  activeProject=idx; activePanel=0;
  updateProgress();
}
function panelRight(){
  const scroll=document.getElementById("scroll-"+activeProject);
  const panels=scroll.children;
  if(activePanel<panels.length-1){
    activePanel++;
    let offset=0; for(let i=0;i<activePanel;i++) offset+=panels[i].offsetWidth;
    scroll.style.transform=`translateX(${-offset}px)`;
    updateProgress();
  } else if(activeProject<projects.length-1){ goToProject(activeProject+1); }
}
function panelLeft(){
  if(activePanel>0){
    const scroll=document.getElementById("scroll-"+activeProject);
    const panels=scroll.children;
    activePanel--;
    let offset=0; for(let i=0;i<activePanel;i++) offset+=panels[i].offsetWidth;
    scroll.style.transform=`translateX(${-offset}px)`;
    updateProgress();
  } else if(activeProject>0){ goToProject(activeProject-1); }
}
function updateProgress(){
  const scroll=document.getElementById("scroll-"+activeProject);
  const n=scroll.children.length;
  progress.innerHTML="";
  for(let i=0;i<n;i++){
    const d=document.createElement("div");
    d.className="prog-dot"+(i===activePanel?" active":"");
    d.setAttribute("data-cursor-hover","");
    d.addEventListener("click",()=>{
      activePanel=i;
      const sc=document.getElementById("scroll-"+activeProject);
      let offset=0; for(let j=0;j<i;j++) offset+=sc.children[j].offsetWidth;
      sc.style.transform=`translateX(${-offset}px)`;
      updateProgress();
    });
    progress.appendChild(d);
  }
}

/* wheel + keyboard */
let wheelLock=false;
document.getElementById("canvas").addEventListener("wheel",e=>{
  e.preventDefault();
  if(wheelLock) return;
  wheelLock=true; setTimeout(()=>wheelLock=false,650);
  const d=(Math.abs(e.deltaX)>Math.abs(e.deltaY))?e.deltaX:e.deltaY;
  if(d>0) panelRight(); else panelLeft();
},{passive:false});
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key==="ArrowDown") panelRight();
  if(e.key==="ArrowLeft"||e.key==="ArrowUp") panelLeft();
});

/* ── LIGHTBOX ──────────────────────────────────────────────────────────────── */
const lb=document.getElementById("lb"),lbImg=document.getElementById("lb-img");
let lbPi=0,lbIi=0;
function openLB(pi,ii){lbPi=pi;lbIi=ii;const imgs=allImgs[pi]||[];if(!imgs.length)return;lbImg.src=imgs[ii];lb.classList.add("open");}
function closeLB(){lb.classList.remove("open");lbImg.src="";}
function stepLB(d){const imgs=allImgs[lbPi]||[];if(!imgs.length)return;lbIi=(lbIi+d+imgs.length)%imgs.length;lbImg.src=imgs[lbIi];}
document.getElementById("lb-close").addEventListener("click",closeLB);
document.getElementById("lb-prev").addEventListener("click",()=>stepLB(-1));
document.getElementById("lb-next").addEventListener("click",()=>stepLB(1));
lb.addEventListener("click",e=>{if(e.target===lb)closeLB();});
document.addEventListener("keydown",e=>{if(!lb.classList.contains("open"))return;if(e.key==="Escape")closeLB();if(e.key==="ArrowRight")stepLB(1);if(e.key==="ArrowLeft")stepLB(-1);});

/* ── INIT ──────────────────────────────────────────────────────────────────── */
buildSidebar();
buildCanvas();
goToProject(0);
window.addEventListener("resize",()=>{const rowH=window.innerHeight-50;snakeInner.style.transform=`translateY(${-activeProject*rowH}px)`;});

/* ── Stars: inserted once core's shared helper is ready (keeps core deferred) ── */
function addStars(){
  const tabs=document.querySelectorAll("#sidebar .tab");
  const intros=document.querySelectorAll(".project-intro");
  projects.forEach((p,i)=>{
    if(!p.star||!window.GLITCH||!GLITCH.makeStar) return;
    const th=tabs[i]&&tabs[i].querySelector(".tab-header");
    if(th&&!th.querySelector(".star-badge")) th.insertBefore(GLITCH.makeStar(p.star),th.querySelector(".tab-arrow"));
    const pn=intros[i]&&intros[i].querySelector(".pi-name");
    if(pn&&!pn.querySelector(".star-badge")) pn.appendChild(GLITCH.makeStar(p.star,"pi-star"));
  });
}
(function whenCore(){
  if(window.GLITCH&&GLITCH.makeStar) return addStars();
  if(document.readyState==="loading") window.addEventListener("DOMContentLoaded",whenCore,{once:true});
  else setTimeout(whenCore,30);
})();
</script>
