<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glitch Artworks — Branding</title>

<!-- Shared chrome: header, nav, social, day/night toggle, footer, cursor, orbs, grain, lightning protection, stars -->
<link rel="stylesheet" href="glitch-core.css">
<script>try{if(localStorage.getItem('glitch-theme')==='day')document.documentElement.classList.add('day');}catch(e){}</script>
<script>window.GLITCH={active:'branding'};</script>
<script defer src="glitch-core.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300;1,600&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#080706;--bone:#f0ebe0;--white:#fff;--muted:#a09a92;
  --blue:#4a9eff;--border:rgba(255,255,255,0.06);--sidebar:320px;
}
html,body{width:100%;height:100%;background:var(--bg);color:var(--bone);font-family:"Syne",sans-serif;overflow:hidden;cursor:none;}



/* AMBIENT */
.bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,0.038) 1px,transparent 1px);background-size:52px 52px;}
/* .scanline styled centrally in glitch-core.css (accent-tinted, fixed sweep) */
@keyframes scan{0%{top:-2px}100%{top:100vh}}

/* ── DAY/NIGHT VARS ── */
:root{
  --header-bg:rgba(8,8,8,0.0);--footer-bg:rgba(8,7,6,0.0);
  --text:var(--bone);--text-muted:rgba(240,235,224,0.55);--text-dim:rgba(240,235,224,0.22);
  --gold:#c9962a;--logo-filter:none;
  --accent:#4a7fc1;   /* canonical branding blue — drives core cursor, orbs, nav-active */
}
:root.day{
  --bg:#f8f6f1;--bone:#1a1a1a;--muted:#7a7570;--border:rgba(0,0,0,0.07);
  --header-bg:rgba(248,246,241,0.45);
  --text:#1a1a1a;--text-muted:rgba(26,26,26,0.55);--text-dim:rgba(26,26,26,0.22);
  --gold:#b8860b;--logo-filter:invert(1) brightness(0.15);
}
:root.day html,:root.day body{background:var(--bg);color:var(--bone);}

:root.day .project-intro .bg-cover::after{
  background:linear-gradient(
    to bottom,
    transparent 0%,
    transparent 35%,
    rgba(0,0,0,0.45) 58%,
    rgba(0,0,0,0.80) 75%,
    rgba(0,0,0,0.95) 100%
  );
}
:root.day .pi-name{color:#fff;}
:root.day .pi-col-label{color:rgba(255,255,255,0.4);}
:root.day .pi-col-val{color:rgba(255,255,255,0.7);}
:root.day .pi-hint{color:rgba(255,255,255,0.2);}
:root.day .pi-num{color:rgba(74,158,255,0.7);}
:root.day .project-intro::before{background:linear-gradient(90deg,rgba(74,158,255,0.4),transparent);}
/* cp-text panel = solid blue in day mode */
:root.day .cp-text{background:#fff;border-right:0.5px solid rgba(0,0,0,0.08);}
:root.day .cp-text .cpt-label{color:rgba(0,0,0,0.55);}
:root.day .cp-text .cpt-body{color:#000;}
:root.day .cp-text .cpt-section-label{color:rgba(0,0,0,0.4);}
/* project-scroll container bg */
:root.day .project-scroll{background:#f4f1eb;}
:root.day .cp{background:#fff;}
:root.day .cp-text{background:#fff;}
:root.day .cp-text .cpt-label{color:rgba(0,0,0,0.5);}
:root.day .cp-text .cpt-body{color:#000;}
:root.day .cp-phone-grid{background:#e8e8e8;}
:root.day .cp-phone-grid .phone-slot{background:#fff;}
:root.day .cp-duo{background:#fff;}
:root.day .cp-duo .duo-slot{background:#fafafa;}
:root.day .cp-phone{background:#fff;}
:root.day .cp-phone .duo-slot{background:#fff;}
:root.day .ph{background:#e8f0ff;}
:root.day .ph span{color:rgba(74,158,255,0.25);}
:root.day .phantom-stage{background:#1a1a2a;}
:root.day .wd-video-panel{background:#f0ebe0;}
:root.day .ds-right{background:#e8f5e8;}
/* sidebar day */
:root.day .sidebar{background:#f4f1eb;}
:root.day .sidebar-title{color:#1a1a1a;}
:root.day .tab-name{color:rgba(0,0,0,0.45);}
:root.day .tab.active .tab-name{color:#1a1a1a;}
:root.day .tab-num{color:rgba(0,0,0,0.2);}
:root.day .brief-text{color:rgba(0,0,0,0.55);}
:root.day .brief-type{color:rgba(74,158,255,0.7);}
:root.day .brief-tag{border-color:rgba(74,158,255,0.3);color:rgba(74,158,255,0.75);}
/* project intro panel day */
/* progress dots day */
:root.day .prog-dot{background:rgba(0,0,0,0.2);}
:root.day .prog-dot:hover{background:rgba(74,158,255,0.6);}
:root.day .prog-dot.active{background:var(--blue);}
/* shell bg */
:root.day .shell{background:#f4f1eb;}
:root.day .canvas{background:#f4f1eb;}


/* SHELL */
.shell{position:fixed;top:50px;left:0;right:0;bottom:0;display:flex;z-index:1;}

/* SIDEBAR */
.sidebar{width:var(--sidebar);flex-shrink:0;height:100%;overflow-y:auto;overflow-x:hidden;border-right:0.5px solid var(--border);display:flex;flex-direction:column;scrollbar-width:none;}
.sidebar::-webkit-scrollbar{display:none;}
.sidebar-head{padding:24px 28px 18px;border-bottom:0.5px solid var(--border);flex-shrink:0;}
.sidebar-label{font-size:8.8px;letter-spacing:0.3em;text-transform:uppercase;color:rgba(74,158,255,0.55);margin-bottom:5px;}
.sidebar-title{font-family:"Cormorant Garamond",serif;font-weight:300;font-size:24.2px;color:var(--bone);line-height:1.1;}

/* TABS */
.tab{border-bottom:0.5px solid var(--border);overflow:hidden;flex-shrink:0;transition:background 0.3s;cursor:none;}
.tab:hover{background:rgba(74,158,255,0.03);}
.tab.active{background:rgba(74,158,255,0.05);}
.tab-header{display:flex;align-items:center;gap:10px;padding:13px 28px;cursor:none;position:relative;}
.tab-header::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1.5px;background:var(--blue);transform:scaleY(0);transition:transform 0.35s cubic-bezier(0.16,1,0.3,1);box-shadow:0 0 8px var(--blue);}
.tab.active .tab-header::before{transform:scaleY(1);}
.tab-num{font-size:9.9px;letter-spacing:0.2em;color:rgba(240,235,224,0.18);flex-shrink:0;transition:color 0.3s;}
.tab.active .tab-num{color:rgba(74,158,255,0.6);}
.tab-name{font-family:"Cormorant Garamond",serif;font-weight:300;font-size:17.6px;color:rgba(240,235,224,0.5);letter-spacing:0.02em;transition:color 0.3s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.tab.active .tab-name{color:var(--bone);}
.tab-arrow{font-size:9.9px;color:rgba(74,158,255,0);transition:color 0.3s,transform 0.4s;flex-shrink:0;}
.tab.active .tab-arrow{color:rgba(74,158,255,0.5);transform:rotate(90deg);}

/* STAR BADGES */
.star-badge{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;flex-shrink:0;cursor:none;position:relative;}
.star-badge svg{width:12px;height:12px;}
.star-badge.hw svg{animation:starPulse 2s ease-in-out infinite;}
@keyframes starPulse{0%,100%{opacity:0.5;filter:drop-shadow(0 0 2px #4a9eff);}50%{opacity:1;filter:drop-shadow(0 0 8px #4a9eff) drop-shadow(0 0 16px rgba(74,158,255,0.6));}}
.star-badge.rc svg{filter:drop-shadow(0 0 4px #ff8c42);}

/* STAR GLASS CARD — appears next to star on click */
.star-card{
  position:fixed;z-index:9990;
  background:rgba(8,7,6,0.88);
  border:0.5px solid rgba(255,255,255,0.1);
  backdrop-filter:blur(20px);
  padding:12px 16px;border-radius:6px;
  pointer-events:none;opacity:0;
  transition:opacity 0.25s,transform 0.25s;
  transform:translateY(4px) scale(0.96);
  min-width:220px;max-width:280px;
  box-shadow:0 8px 32px rgba(0,0,0,0.5);
}
.star-card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent);}
.star-card.show{opacity:1;transform:translateY(0) scale(1);}
.star-card-label{font-size:8.8px;letter-spacing:0.25em;text-transform:uppercase;display:block;margin-bottom:5px;}
.star-card.hw .star-card-label{color:rgba(74,158,255,0.8);}
.star-card.rc .star-card-label{color:rgba(255,140,66,0.8);}
.star-card-msg{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:14.3px;font-weight:300;color:rgba(255,255,255,0.6);line-height:1.6;}

/* TAB BRIEF */
.tab-brief{max-height:0;overflow:hidden;transition:max-height 0.5s cubic-bezier(0.16,1,0.3,1),opacity 0.4s;opacity:0;padding:0 28px;}
.tab.active .tab-brief{max-height:240px;opacity:1;padding:0 28px 20px;}
.brief-type{font-size:8.8px;letter-spacing:0.25em;text-transform:uppercase;color:rgba(74,158,255,0.55);margin-bottom:7px;display:block;}
.brief-text{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:14.3px;font-weight:300;line-height:1.75;color:rgba(255,255,255,0.5);letter-spacing:0.02em;}
.brief-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
.brief-tag{font-size:8.8px;letter-spacing:0.18em;text-transform:uppercase;padding:3px 8px;border:0.5px solid rgba(74,158,255,0.2);color:rgba(74,158,255,0.55);}

/* CANVAS */
.canvas{flex:1;height:100%;overflow:hidden;position:relative;}
.snake{position:absolute;inset:0;overflow:hidden;}
.snake-inner{display:flex;flex-direction:column;transition:transform 0.9s cubic-bezier(0.16,1,0.3,1);will-change:transform;}

/* PROJECT ROW */
.project-row{width:100%;height:calc(100vh - 50px);flex-shrink:0;display:flex;flex-direction:row;overflow:hidden;position:relative;}
.project-scroll{display:flex;flex-direction:row;height:100%;transition:transform 0.8s cubic-bezier(0.16,1,0.3,1);will-change:transform;}

/* INTRO PANEL */
.project-intro{
  width:calc(100vw - var(--sidebar));height:100%;flex-shrink:0;
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:48px 52px;position:relative;border-right:0.5px solid var(--border);
  overflow:hidden;
}
.project-intro .bg-cover{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0.92;filter:none;z-index:0;}
.project-intro .bg-cover.dim{opacity:0.6;}
/* gradient mask — full colour top, darkened bottom where text lives */
.project-intro .bg-cover::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(
    to bottom,
    transparent 0%,
    transparent 35%,
    rgba(8,7,6,0.55) 58%,
    rgba(8,7,6,0.85) 75%,
    rgba(8,7,6,0.95) 100%
  );
}
.project-intro > *:not(.bg-cover){position:relative;z-index:1;}
.project-intro::before{content:"";position:absolute;top:48px;left:52px;right:52px;height:0.5px;background:linear-gradient(90deg,rgba(74,158,255,0.3),transparent);z-index:2;}
.pi-num{font-size:9.9px;letter-spacing:0.3em;text-transform:uppercase;color:rgba(74,158,255,0.55);margin-bottom:10px;display:block;}
.pi-name{font-family:"Cormorant Garamond",serif;font-weight:300;font-size:clamp(57.2px,7.5vw,118.8px);line-height:0.88;color:var(--bone);}
.pi-name em{font-style:italic;color:var(--blue);}
.pi-name .pi-star{display:inline-flex;vertical-align:middle;margin-left:10px;cursor:none;}
.pi-meta{margin-top:28px;display:flex;gap:36px;flex-wrap:wrap;}
.pi-col-label{font-size:8.8px;letter-spacing:0.25em;text-transform:uppercase;color:rgba(255,255,255,0.22);margin-bottom:5px;display:block;}
.pi-col-val{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:14.3px;font-weight:300;color:rgba(255,255,255,0.55);line-height:1.7;max-width:300px;}
.pi-hint{position:absolute;bottom:48px;right:52px;display:flex;align-items:center;gap:8px;font-size:8.8px;letter-spacing:0.25em;text-transform:uppercase;color:rgba(255,255,255,0.12);animation:breathe 2.5s ease-in-out infinite;z-index:2;}
.pi-hint::after{content:"→";color:rgba(74,158,255,0.4);font-size:13.2px;}
@keyframes breathe{0%,100%{opacity:0.12}50%{opacity:0.45}}

/* CONTENT PANELS */
.cp{height:100%;flex-shrink:0;position:relative;overflow:hidden;border-right:0.5px solid var(--border);}
.cp img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0;filter:saturate(0.82) brightness(0.88);transition:transform 0.9s cubic-bezier(0.16,1,0.3,1),filter 0.6s;}
.cp:hover img{transform:scale(1.04);filter:saturate(1) brightness(1);}
.cp-w{width:700px;}
.cp-m{width:520px;}
.cp-n{width:420px;}
.cp-split{width:380px;display:flex;flex-direction:column;}
.cp-split .half{flex:1;overflow:hidden;position:relative;border-bottom:0.5px solid var(--border);}
.cp-split .half:last-child{border-bottom:none;}
.cp-split .half img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(0.82) brightness(0.88);transition:filter 0.6s;}
.cp-split .half:hover img{filter:saturate(1) brightness(1);}
.cp-text{width:360px;padding:48px 40px;display:flex;flex-direction:column;justify-content:center;gap:24px;background:rgba(8,7,6,0.5);}
.cpt-label{font-size:8.8px;letter-spacing:0.25em;text-transform:uppercase;color:rgba(74,158,255,0.5);margin-bottom:6px;display:block;}
.cpt-body{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:14.85px;font-weight:300;line-height:1.85;color:rgba(255,255,255,0.55);}
.ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#0a0e16;}
.ph span{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:22px;letter-spacing:0.15em;color:rgba(74,158,255,0.07);}
/* media glow spot */
.mglow{position:absolute;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(74,158,255,0.2) 0%,transparent 65%);transform:translate(-50%,-50%);pointer-events:none;opacity:0;transition:opacity 0.3s;z-index:5;}

/* ── CUSTOM SCENE PANELS ── */

/* Nike Phantom — red stage */
.phantom-stage{
  width:calc(100vw - var(--sidebar));height:100%;flex-shrink:0;
  background:#0a0000;position:relative;border-right:0.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;gap:32px;overflow:hidden;
}
.phantom-stage .bg-red{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(160,0,0,0.35) 0%,rgba(80,0,0,0.2) 40%,transparent 70%);}
.phantom-stage .ps-grid{position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,rgba(255,0,0,0.03) 0px,rgba(255,0,0,0.03) 1px,transparent 1px,transparent 60px),repeating-linear-gradient(0deg,rgba(255,0,0,0.03) 0px,rgba(255,0,0,0.03) 1px,transparent 1px,transparent 60px);}
.poster-card{
  width:200px;flex-shrink:0;position:relative;z-index:2;
  border-radius:4px;overflow:hidden;cursor:none;
  box-shadow:0 0 0 0 rgba(200,0,0,0);
  transition:transform 0.5s cubic-bezier(0.16,1,0.3,1),box-shadow 0.4s;
}
.poster-card img{width:100%;display:block;filter:saturate(0.85);}
.poster-card::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(220,30,30,0) 0%,transparent 70%);opacity:0;transition:opacity 0.4s;}
.poster-card:hover{transform:translateY(-8px) scale(1.04);box-shadow:0 0 40px rgba(200,20,20,0.6),0 0 80px rgba(160,0,0,0.3);}
.poster-card:hover::after{opacity:1;}
.poster-card:hover img{filter:saturate(1);}
.poster-card.tall{width:180px;margin-top:-24px;}
.poster-card.poster-full{flex-shrink:0;height:100%;width:auto;margin-top:0;border-radius:0;overflow:visible;}
.poster-card.poster-full img{height:100%;width:auto;display:block;object-fit:contain;}
.phantom-stage{gap:0;align-items:stretch;padding:0;}

.wd-video-panel{
  flex-shrink:0;height:100%;width:auto;position:relative;border-right:0.5px solid var(--border);
  background:#000;display:flex;align-items:center;justify-content:center;
}
.wd-video-panel video{height:100%;width:auto;display:block;object-fit:contain;}

/* Wedding — dark floral scene */
.wedding-scene{
  width:calc(100vw - var(--sidebar));height:100%;flex-shrink:0;
  position:relative;border-right:0.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.ws-bg{position:absolute;inset:0;background-size:cover;background-position:center;}
.ws-overlay{position:absolute;inset:0;background:rgba(4,2,8,0.45);}
.ws-monogram{position:absolute;left:50%;top:50%;transform:translate(-55%,-52%);width:42%;max-width:480px;z-index:2;filter:drop-shadow(0 0 40px rgba(180,140,60,0.3));}
.ws-monogram img{width:100%;display:block;}
.ws-frame{position:absolute;right:8%;top:50%;transform:translateY(-50%);width:260px;z-index:3;}
.ws-frame img{width:100%;display:block;filter:drop-shadow(0 8px 32px rgba(0,0,0,0.8));}
.ws-flower-l{position:absolute;left:-2%;bottom:0;width:30%;z-index:1;opacity:0.7;}
.ws-flower-l img{width:100%;display:block;}
.ws-flower-r{position:absolute;right:28%;top:-5%;width:18%;z-index:1;opacity:0.6;}
.ws-flower-r img{width:100%;display:block;}

/* Greensip — forest portal */
.greensip-scene{
  width:calc(100vw - var(--sidebar));height:100%;flex-shrink:0;
  position:relative;border-right:0.5px solid var(--border);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.gs-bg{position:absolute;inset:0;background-size:cover;background-position:center;}
.gs-overlay{position:absolute;inset:0;background:rgba(4,12,4,0.2);}
.gs-portal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;width:260px;}
.gs-portal img{width:100%;display:block;filter:drop-shadow(0 0 40px rgba(100,200,80,0.4));}
.gs-wordmark{position:absolute;top:14%;left:50%;transform:translateX(-50%);z-index:3;width:260px;}
.gs-wordmark img{width:100%;display:block;filter:brightness(1.3);}

/* Ugly Ducky — wood bg + green packaging */
.ducky-scene{
  width:calc(100vw - var(--sidebar));height:100%;flex-shrink:0;
  position:relative;border-right:0.5px solid var(--border);overflow:hidden;
  display:flex;
}
.ds-left{flex:1;position:relative;display:flex;align-items:center;justify-content:center;}
.ds-wood{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0.6;}
.ds-logo{position:relative;z-index:2;width:55%;max-width:260px;}
.ds-logo img{width:100%;display:block;filter:drop-shadow(0 0 20px rgba(0,0,0,0.8));}
.ds-right{width:52%;background:#1a2a1a;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px;}
.ds-right::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(40,100,40,0.3) 0%,transparent 70%);}
.ds-pkg{position:relative;z-index:1;width:88%;max-width:340px;}
.ds-pkg img{width:100%;display:block;filter:drop-shadow(0 8px 24px rgba(0,0,0,0.6));}

/* Haviscent — full bg */
.haviscent-scene{
  width:calc(100vw - var(--sidebar));height:100%;flex-shrink:0;
  position:relative;border-right:0.5px solid var(--border);overflow:hidden;
}
.hv-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:saturate(0.8) brightness(0.7);}
.hv-overlay{position:absolute;inset:0;background:linear-gradient(135deg,rgba(8,4,16,0.6) 0%,rgba(8,4,16,0.2) 100%);}
.hv-content{position:absolute;bottom:52px;left:52px;z-index:2;}
.hv-logo{width:200px;margin-bottom:16px;}
.hv-logo img{width:100%;display:block;filter:brightness(1.2);}
.hv-tagline{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:17.6px;color:rgba(255,255,255,0.5);}

/* Airvia intro — feature wall bg */
/* Liftup intro — KL skyline bg */
/* Both handled by .bg-cover */

/* PROGRESS DOTS */
.progress{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:200;align-items:center;pointer-events:auto;padding:8px 12px;}
.prog-dot{
  width:6px;height:6px;border-radius:50%;
  background:rgba(255,255,255,0.18);
  transition:all 0.35s;
  cursor:none;
  pointer-events:auto;
}
.prog-dot:hover{background:rgba(74,158,255,0.5);}
.prog-dot.active{background:var(--blue);width:24px;border-radius:3px;}

/* LIGHTBOX */
#lb{display:none;position:fixed;inset:0;z-index:9998;background:rgba(4,6,12,0.97);backdrop-filter:blur(20px);align-items:center;justify-content:center;}
#lb.open{display:flex;}
#lb img{max-width:90vw;max-height:88vh;object-fit:contain;}
#lb-close{position:absolute;top:24px;right:32px;font-size:9.9px;letter-spacing:0.3em;text-transform:uppercase;color:rgba(255,255,255,0.3);cursor:none;transition:color 0.3s;}
#lb-close:hover{color:var(--blue);}
#lb-prev,#lb-next{position:absolute;top:50%;transform:translateY(-50%);font-size:9.9px;letter-spacing:0.2em;text-transform:uppercase;color:rgba(255,255,255,0.2);cursor:none;transition:color 0.3s;padding:16px;user-select:none;}
#lb-prev{left:16px;}#lb-next{right:16px;}
#lb-prev:hover,#lb-next:hover{color:var(--blue);}

@media(max-width:760px){
  .shell{flex-direction:column;}
  .sidebar{width:100%;height:auto;border-right:none;border-bottom:0.5px solid var(--border);}
}


/* PHONE GRID — all phones in one aligned panel */
.cp-phone-grid{
  flex-shrink:0;height:100%;
  background:#080706;
  border-right:0.5px solid var(--border);
  display:grid;
  grid-template-rows:1fr 1fr;
  grid-auto-columns:1fr;
  grid-auto-flow:column;  /* fill top→bottom, then next column */
  gap:1px;
  background-color:#111;
}
.cp-phone-grid .phone-slot{
  background:#080706;
  display:flex;align-items:center;justify-content:center;
  padding:12px 8px;
  overflow:hidden;
  position:relative;
  min-height:0;
  min-width:0;
  /* slot itself is constrained by grid row */
}
.cp-phone-grid .phone-slot img{
  display:block;
  /* fill the slot height, let width follow aspect ratio */
  width:auto;
  height:100%;
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  filter:saturate(0.88) brightness(0.92);
  transition:filter 0.5s, transform 0.4s;
}
.cp-phone-grid .phone-slot:hover img{
  filter:saturate(1) brightness(1);
  transform:scale(1.02);
}

/* DUO column — 2 images stacked, full height, no crop */
.cp-duo{
  width:520px;
  display:flex;flex-direction:column;
  background:#080706;
}
.cp-duo .duo-slot{
  flex:1;overflow:hidden;position:relative;
  display:flex;align-items:center;justify-content:center;
  border-bottom:0.5px solid var(--border);
  background:#0a0d12;
  padding:0;
}
.cp-duo .duo-slot:last-child{border-bottom:none;}
.cp-duo .duo-slot img{
  width:100%;height:100%;
  object-fit:contain;
  display:block;
  filter:saturate(0.88) brightness(0.92);
  transition:filter 0.5s;
  padding:8px;
}
.cp-duo .duo-slot:hover img{filter:saturate(1) brightness(1);}
/* wide duo for landscape images */
.cp-duo-wide{width:720px;}
/* phone column — narrower, perfect for portrait phone PNGs */
.cp-phone{width:340px;background:#080706;display:flex;flex-direction:column;}
.cp-phone .duo-slot{flex:1;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;border-bottom:0.5px solid var(--border);background:#080706;padding:8px;}
.cp-phone .duo-slot:last-child{border-bottom:none;}
.cp-phone .duo-slot img{width:auto;height:100%;max-width:100%;object-fit:contain;display:block;filter:saturate(0.88);transition:filter 0.5s;}
.cp-phone .duo-slot:hover img{filter:saturate(1);}
</style>

const sidebar = document.getElementById("sidebar");

function makeGlow(){
  const g = document.createElement("div"); g.className="mglow"; return g;
}
function attachGlow(el, g){
  el.addEventListener("mousemove",e=>{
    const r=el.getBoundingClientRect();
    g.style.left=(e.clientX-r.left)+"px"; g.style.top=(e.clientY-r.top)+"px"; g.style.opacity="1";
  });
  el.addEventListener("mouseleave",()=>{ g.style.opacity="0"; });
}
function mkImg(src, pi, ii, clickable=true){
  const im=document.createElement("img");
  im.src=src; im.loading="lazy"; im.alt="";
  if(clickable){ im.addEventListener("click",()=>openLB(pi,ii)); }
  if(!allImgs[pi]) allImgs[pi]=[];
  allImgs[pi].push(src);
  return im;
}

// ── STAR SVG ──
function starSVG(isHw){
  const col = isHw?"#4a9eff":"#ff8c42";
  return `<svg viewBox="0 0 20 20" fill="${col}" xmlns="http://www.w3.org/2000/svg"><path d="M10 1l2.39 4.84 5.34.78-3.86 3.76.91 5.32L10 13.27l-4.78 2.51.91-5.32L2.27 6.62l5.34-.78L10 1z"/></svg>`;
}

// ── STAR CARD ──
const starCard = document.getElementById("starCard");
const starCardLabel = document.getElementById("starCardLabel");
const starCardMsg = document.getElementById("starCardMsg");
let scTimer;
function showStarCard(el, isHw){
  clearTimeout(scTimer);
  const r = el.getBoundingClientRect();
  starCard.className = "star-card show " + (isHw?"hw":"rc");
  starCardLabel.textContent = isHw ? "Class Project" : "Real Client";
  starCardMsg.textContent = isHw
    ? "Academic assignment — designed to brief, executed to portfolio standard."
    : "Commissioned by a real client. Delivered and applied in production.";
  // position card near the star
  let left = r.right + 10;
  let top = r.top - 10;
  if(left + 290 > window.innerWidth) left = r.left - 295;
  if(top + 90 > window.innerHeight) top = window.innerHeight - 100;
  starCard.style.left = left+"px";
  starCard.style.top = top+"px";
  scTimer = setTimeout(()=>{ starCard.classList.remove("show"); }, 3500);
}
document.addEventListener("click", e=>{
  if(!e.target.closest(".star-badge")) starCard.classList.remove("show");
});

  hint.innerHTML="scroll right <span style='color:rgba(74,158,255,0.4);font-size:13.2px;'>→</span>";
  d.appendChild(hint);
  return d;
}

// ── NAV ──
function goToProject(idx){
  if(idx<0||idx>=projects.length) return;
  document.querySelectorAll(".tab").forEach((t,i)=>t.classList.toggle("active",i===idx));
  const tabs=document.querySelectorAll(".tab");
  if(tabs[idx]) tabs[idx].scrollIntoView({behavior:"smooth",block:"nearest"});
  const rowH=document.getElementById("row-0").offsetHeight;
  snakeInner.style.transform=`translateY(${-idx*rowH}px)`;
  if(activeProject!==idx){
    const old=document.getElementById("scroll-"+activeProject);
    if(old) old.style.transform="translateX(0)";
  }
  activeProject=idx; activePanel=0;
  updateProgress();
}

function panelRight(){
  const scroll=document.getElementById("scroll-"+activeProject);
  const panels=scroll.children;
  if(activePanel<panels.length-1){
    activePanel++;
    let offset=0;
    for(let i=0;i<activePanel;i++) offset+=panels[i].offsetWidth;
    scroll.style.transform=`translateX(${-offset}px)`;
    updateProgress();
  } else if(activeProject<projects.length-1){
    goToProject(activeProject+1);
  }
}
function panelLeft(){
  if(activePanel>0){
    const scroll=document.getElementById("scroll-"+activeProject);
    const panels=scroll.children;
    activePanel--;
    let offset=0;
    for(let i=0;i<activePanel;i++) offset+=panels[i].offsetWidth;
    scroll.style.transform=`translateX(${-offset}px)`;
    updateProgress();
  } else if(activeProject>0){
    goToProject(activeProject-1);
  }
}
function updateProgress(){
  const scroll = document.getElementById("scroll-"+activeProject);
  const totalPanels = scroll ? scroll.children.length : 1;
  const prog = document.getElementById("progress");
  prog.innerHTML = "";
  for(let i=0;i<totalPanels;i++){
    const d=document.createElement("div");
    d.className="prog-dot"+(i===activePanel?" active":"");
    // clicking a dot jumps to that panel
    (function(idx){
      d.addEventListener("click",()=>{
        const sc=document.getElementById("scroll-"+activeProject);
        const panels=sc.children;
        activePanel=idx;
        let offset=0;
        for(let j=0;j<idx;j++) offset+=panels[j].offsetWidth;
        sc.style.transform=`translateX(${-offset}px)`;
        updateProgress();
      });
    })(i);
    d.style.cursor="none";
    prog.appendChild(d);
  }
}

// wheel
let wLock=false;
document.getElementById("canvas").addEventListener("wheel",e=>{
  e.preventDefault();
  if(wLock) return; wLock=true; setTimeout(()=>{wLock=false;},650);
  const horiz=Math.abs(e.deltaX)>Math.abs(e.deltaY);
  if(horiz){ if(e.deltaX>0) panelRight(); else panelLeft(); }
  else { if(e.deltaY>0) panelRight(); else panelLeft(); }
},{passive:false});

// touch
let tx0=0,ty0=0;
document.getElementById("canvas").addEventListener("touchstart",e=>{tx0=e.touches[0].clientX;ty0=e.touches[0].clientY;},{passive:true});
document.getElementById("canvas").addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-tx0, dy=e.changedTouches[0].clientY-ty0;
  if(Math.abs(dx)>Math.abs(dy)){ if(dx<-40) panelRight(); else if(dx>40) panelLeft(); }
  else{ if(dy<-40) panelRight(); }
},{passive:true});

document.addEventListener("keydown",e=>{
  if(["ArrowRight","ArrowDown"].includes(e.key)) panelRight();
  if(e.key==="ArrowLeft") panelLeft();
  if(e.key==="ArrowUp"&&activeProject>0) goToProject(activeProject-1);
});

// ── Hover feedback drives the CORE cursor (core owns the cursor element itself) ──
(function wireHover(){
  function run(){
    var cur=document.getElementById("cursor");
    if(!cur) return; // touch / no-cursor device: core skips it
    document.querySelectorAll("a,.tab,.star-badge,#lb-close,#lb-prev,#lb-next,.poster-card,.cp,.cp-art,.prog-dot").forEach(function(el){
      el.addEventListener("mouseenter",function(){cur.classList.add("hover");});
      el.addEventListener("mouseleave",function(){cur.classList.remove("hover");});
    });
  }
  if(document.readyState==="loading") window.addEventListener("DOMContentLoaded",function(){setTimeout(run,40);},{once:true});
  else setTimeout(run,40);
})();

// ── LIGHTBOX ──
const lb=document.getElementById("lb");
const lbImg=document.getElementById("lb-img");
let lbPi=0,lbIi=0;
function openLB(pi,ii){
  if(!allImgs[pi]||!allImgs[pi][ii]) return;
  lbPi=pi;lbIi=ii;lbImg.src=allImgs[pi][ii];lb.classList.add("open");
}
function closeLB(){lb.classList.remove("open");lbImg.src="";}
function stepLB(d){const imgs=allImgs[lbPi]||[];lbIi=(lbIi+d+imgs.length)%imgs.length;lbImg.src=imgs[lbIi]||"";}
document.getElementById("lb-close").onclick=closeLB;
document.getElementById("lb-prev").onclick=()=>stepLB(-1);
document.getElementById("lb-next").onclick=()=>stepLB(1);
lb.addEventListener("click",e=>{if(e.target===lb)closeLB();});
document.addEventListener("keydown",e=>{
  if(!lb.classList.contains("open")) return;
  if(e.key==="Escape") closeLB();
  if(e.key==="ArrowLeft") stepLB(-1);
  if(e.key==="ArrowRight") stepLB(1);
});



// ── INIT ──
buildSidebar();
buildCanvas();
goToProject(0);
window.addEventListener("resize",()=>{
  const rH=document.getElementById("row-0").offsetHeight;
  snakeInner.style.transition="none";
  snakeInner.style.transform=`translateY(${-activeProject*rH}px)`;
  setTimeout(()=>snakeInner.style.transition="",50);
});
</script>
